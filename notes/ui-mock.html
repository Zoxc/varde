// An axis field's targets while it's the one picking, else just its axis.
function axisPickSvg(o, name, ax, lines, m) {
  if (o.pick === name) return axesSvg(o[name], lines) + (OPS[o.kind].picks[name].edges ? edgesSvg(m.edges, [o[name]], true) : '');
  if (!ax) return '';
  return `<g class="axc on" style="--ax:${AXIS_COLOR[o[name]] || 'var(--accent)'}">${lineP(add(ax.p, mul(ax.d, -40)), add(ax.p, mul(ax.d, 130)), 'vis')}</g>`;
}
function planeSvg(pl, faces) {
  const n = pl.n, t = norm(cross(n, Math.abs(n[2]) < .9 ? [0, 0, 1] : [1, 0, 0])), s = cross(n, t);
  const ps = faces.flatMap(f => f.p).map(p => sub(p, pl.p)), us = ps.map(p => dot(p, t)), vs = ps.map(p => dot(p, s));
  const [u0, u1, v0, v1] = [Math.min(...us) - 10, Math.max(...us) + 10, Math.min(...vs) - 10, Math.max(...vs) + 10];
  const P = (u, v) => add(pl.p, add(mul(t, u), mul(s, v)));
  return `<polygon class="pplane" points="${pts([P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)])}"/>`;
}

// ---- panel parts
function pickList(o, name, label, list, ph) {
  const on = o.pick === name;
  return `<div class="fld top"><label>${label}</label><div class="pf list${on ? ' on' : ''}" data-act="opf:${name}">
    ${list.map(it => `<span class="chip"><span class="nm">${it.label}</span>${it.meta ? `<span class="meta">${it.meta}</span>` : ''}<button class="x" data-act="opx:${name}:${it.id}" title="Remove">${icon('close')}</button></span>`).join('')}
    ${on || !list.length ? `<span class="ph">${list.length ? '+ ' : ''}${ph}</span>` : ''}
  </div></div>`;
}
function pickOne(o, name, label, text, ph) {
  const v = o[name];
  return `<div class="fld"><label>${label}</label><div class="pf${o.pick === name ? ' on' : ''}" data-act="opf:${name}">
    ${v ? `<span class="chip"><span class="nm">${text || 'Missing'}</span><button class="x" data-act="opx:${name}:${v}" title="Clear">${icon('close')}</button></span>` : `<span class="ph">${ph}</span>`}
  </div></div>`;
}
const choices = (o, name, list) => `<div class="chs">${list.map(([v, l]) =>
  `<button class="ch${o[name] === v ? ' on' : ''}" data-act="opc:${name}:${v}">${l}</button>`).join('')}</div>`;
function numField(o, name, label, r) {
  const err = r.errs[name];
  return `<div class="fld"><label for="f-${name}">${label}</label><input id="f-${name}" data-field="${name}" value="${esc(o[name])}"${err ? ' class="bad"' : ''} spellcheck="false" autocomplete="off"></div>${err ? `<div class="ferr">${err}</div>` : ''}`;
}
const tick = (o, name, label, sub) =>
  `<div class="cb${o[name] ? ' on' : ''}" data-act="opt:${name}"><span class="box">${icon('check')}</span><span>${label}${sub ? `<span class="sub">${sub}</span>` : ''}</span></div>`;
const bodyTicks = (o, m) => `<h4>Bodies</h4>${m.bodies.map(b =>
  `<div class="cb${o.excl.includes(b.id) ? '' : ' on'}" data-act="opt:excl:${b.id}"><span class="box">${icon('check')}</span>${b.name}</div>`).join('') || '<div class="pnote">No bodies yet</div>'}`;
const bodyItems = (ids, m) => ids.map(id => ({ id, label: m.bodies.find(b => b.id === id)?.name || 'Missing body' }));
const bodyNames = (ids, m) => ids.map(id => m.bodies.find(b => b.id === id)?.name).join(', ');
const facesOf = (ids, m) => ids.flatMap(id => m.bodies.find(b => b.id === id)?.faces || []);
const goneBodies = (ids, m) => ids.some(id => !m.bodies.some(b => b.id === id));
const selBodies = m => st.sel?.kind === 'body' ? [st.sel.id] : m.bodies.length === 1 ? [m.bodies[0].id] : [];
const holeRims = m => st.sel?.kind === 'hole' ? [...m.edges.keys()].filter(k => k.startsWith(`rim:${st.sel.id}:`)) : [];
const edgeItems = (ids, m) => ids.map(id => { const e = m.edges.get(id); return { id, label: e?.label || 'Missing edge', meta: e?.meta }; });
const bodiesSum = o => o.bodies.length ? plural(o.bodies.length, 'body', 'bodies') : '';
const Pick = (type, what, hint, more = {}) => ({ type, what, hint, ...more });

// Transforms shown as a draft over the model; moved bodies fade where they were.
function copiesPreview(o, m, r, xs, fade) {
  if (!ready(r)) return { marks: new Set(o.bodies.map(id => 'body:' + id)) };
  const src = facesOf(o.bodies, m);
  return { faces: xs.flatMap(x => xformFaces(src, x)).map(f => ({ ...f, draft: true, tint: 's' })), fade: new Set(fade ? o.bodies : []) };
}
function copiesApply(o, bodies, t, xs, join, move) {
  o.bodies.forEach((id, i) => {
    const b = bodies.find(b => b.id === id);
    if (!b) return;
    if (move) { b.faces = xformFaces(b.faces, xs[0], true); return; }
    const copies = xs.map(x => xformFaces(b.faces, x));
    if (join) b.faces = [...b.faces, ...copies.flat()];
    else copies.forEach((faces, k) => newBody(bodies, `${t.id}:${i}:${k}`, faces));
  });
}
function edgeCheck(o, m, verb) {
  const r = { errs: {} }, es = o.edges.map(id => m.edges.get(id));
  r.sum = o.edges.length ? plural(o.edges.length, 'edge') : 'Click edges';
  if (!m.br) r.error = 'No body to ' + verb;
  else if (es.some(e => !e)) r.error = 'A picked edge is gone';
  else if (!es.length) r.need = `Click edges to ${verb}`;
  else r.es = es;
  return r;
}
const edgePreview = (o, m, r) => ({ svg: (ready(r) ? r.es.map(e => bandSvg(e, ...r.d)).join('') : '') + edgesSvg(m.edges, o.edges) });
function edgeApply(o, bodies, t, r) {
  for (const e of r.es) for (const [side, lines] of bandLines(e, ...r.d)) side.f.tangents = [...(side.f.tangents || []), ...lines];
}

const BOOLS = [['new', 'New body'], ['join', 'Join'], ['cut', 'Cut'], ['int', 'Intersect']];
const BOOL_TINT = { new: 's', join: 's', cut: 'x', int: 'a' };
const REV_EXTENTS = [['full', 'Full 360°'], ['one', 'One side'], ['sym', 'Symmetric'], ['two', 'Two sides']];
const COMBINES = [['union', 'Union'], ['sub', 'Subtract'], ['int', 'Intersect']];
const CIRC_MODES = [['full', 'Full 360°'], ['spacing', 'Spacing'], ['total', 'Total']];
const CHAMFERS = [['equal', 'Equal distance'], ['two', 'Two distances'], ['angle', 'Distance and angle']];

// Each operation: its picks (fields the view fills), init from the selection,
// the panel body, check (field errors, a blocking error or what's still
// needed, a warning), the preview, apply (replaying it on bodies) and its
// timeline row. `needs` refuses to start without a body (or the bracket,
// whose edges and faces are the ones the mock can pick).
const OPS = {
  revolve: {
    label: 'Revolve', icon: 'revolve',
    picks: {
      regions: Pick('region', 'regions', 'Click regions to revolve', { multi: true }),
      axis: Pick('axis', 'an axis', 'Click a sketch line or an origin axis to revolve about'),
    },
    init: m => {
      const sk = st.sel?.kind === 'feature' && SKETCHES[st.sel.id] ? st.sel.id : null;
      const regions = m.regions.filter(g => g.sketch === sk).map(g => g.id);
      return { regions, axis: null, extent: 'full', a1: '180°', a2: '90°', flip: false, op: 'new', excl: [], pick: regions.length ? 'axis' : 'regions' };
    },
    body: (o, m, r) => `
      ${pickList(o, 'regions', 'Profile', o.regions.map(id => ({ id, label: m.regions.find(g => g.id === id)?.label || 'Missing region' })), 'Click regions')}
      ${pickOne(o, 'axis', 'Axis', r.axis?.label, 'Click a line or axis')}
      <h4>Extent</h4>
      ${choices(o, 'extent', REV_EXTENTS)}
      ${o.extent === 'one' || o.extent === 'sym' ? numField(o, 'a1', 'Angle', r) : ''}
      ${o.extent === 'two' ? numField(o, 'a1', 'Side 1', r) + numField(o, 'a2', 'Side 2', r) : ''}
      ${o.extent === 'one' || o.extent === 'two' ? tick(o, 'flip', 'Flip') : ''}
      <h4>Operation</h4>
      ${choices(o, 'op', BOOLS)}
      ${o.op === 'new' ? '' : bodyTicks(o, m)}`,
    check(o, m) {
      const r = { errs: {} }, e = r.errs, ang = k => readVal(o, k, e, { unit: 'deg', max: 360 });
      r.rs = o.regions.map(id => m.regions.find(g => g.id === id));
      r.sum = !m.regions.length ? 'No regions' : o.regions.length ? plural(o.regions.length, 'region') : 'Click regions';
      if (o.extent === 'full') r.span = [0, 360];
      else if (o.extent === 'one') { const a = ang('a1'); if (a != null) r.span = o.flip ? [-a, 0] : [0, a]; }
      else if (o.extent === 'sym') { const a = ang('a1'); if (a != null) r.span = [-a / 2, a / 2]; }
      else {
        const a = ang('a1'), b = ang('a2');
        if (a != null && b != null) {
          if (a + b > 360) e.a2 = 'The sides overlap: together at most 360°';
          else r.span = o.flip ? [-a, b] : [-b, a];
        }
      }
      r.axis = axisOf(o.axis, m.bodies);
      if (!m.regions.length) r.error = 'No closed regions to revolve: draw a sketch first';
      else if (r.rs.some(g => !g)) r.error = 'A picked region is gone';
      else if (!r.rs.length) r.need = 'Click regions to revolve';
      else if (!o.axis) r.need = 'Pick an axis: a sketch line or an origin axis';
      else if (!r.axis) r.error = 'The axis is gone: pick another';
      else {
        for (const g of r.rs) {
          if (Math.abs(dot(sub(r.axis.p, g.o), g.n)) > 1e-6 || Math.abs(dot(r.axis.d, g.n)) > 1e-6) {
            r.error = `The axis isn’t in ${sketchName(g.sketch)}’s plane`;
            break;
          }
          const side = g.pts.map(p => dot(sub(p, r.axis.p), cross(r.axis.d, g.n)));
          if (Math.min(...side) < -1e-6 && Math.max(...side) > 1e-6) { r.error = 'The axis crosses the region: it would revolve through itself'; break; }
        }
      }
      if (!r.error && !r.need && o.op !== 'new' && !m.bodies.some(b => !o.excl.includes(b.id))) {
        r.error = m.bodies.length ? 'Every body is unticked: tick one under Bodies' : `No body to ${labelOf(BOOLS, o.op).toLowerCase()}`;
      }
      return r;
    },
    preview: (o, m, r) => ({
      faces: ready(r) ? r.rs.flatMap(g => revolveFaces(g.pts, r.axis, r.span)).map(f => ({ ...f, draft: true, tint: BOOL_TINT[o.op] })) : [],
      svg: regionsSvg(o, m) + axisPickSvg(o, 'axis', r.axis, [...new Set((o.regions.length ? o.regions : m.regions.map(g => g.id)).map(id => id.split(':')[0]))].flatMap(sketchLines), m),
    }),
    apply(o, bodies, t, r) {
      const faces = r.rs.flatMap(g => revolveFaces(g.pts, r.axis, r.span));
      if (o.op === 'new') newBody(bodies, t.id, faces);
      else if (o.op === 'join') { const b = bodies.find(b => !o.excl.includes(b.id)); if (b) b.faces = [...b.faces, ...faces]; }
    },
    row: (o, r) => {
      const tot = fmt(r.span[1] - r.span[0]) + '°';
      return { meta: tot, info: `${labelOf(REV_EXTENTS, o.extent)}${o.extent === 'full' ? '' : ' · ' + tot} · about ${r.axis.label} · ${labelOf(BOOLS, o.op)}` };
    },
  },

  combine: {
    label: 'Combine', icon: 'combine', needs: 'body',
    picks: {
      target: Pick('body', 'the target', 'Click the body to combine into', { accept: (o, v) => { o.tools = o.tools.filter(id => id !== v); } }),
      tools: Pick('body', 'tool bodies', 'Click the bodies to combine with the target', { multi: true, accept: (o, v) => v === o.target ? 'That’s the target: pick other bodies as tools' : null }),
    },
    init: m => ({ target: st.sel?.kind === 'body' ? st.sel.id : m.bodies[0].id, tools: [], op: 'union', keep: false, pick: 'tools' }),
    body: (o, m) => `
      ${pickOne(o, 'target', 'Target', o.target && bodyItems([o.target], m)[0].label, 'Click a body')}
      ${pickList(o, 'tools', 'Tools', bodyItems(o.tools, m), 'Click bodies')}
      <h4>Operation</h4>
      ${choices(o, 'op', COMBINES)}
      ${tick(o, 'keep', 'Keep tool bodies', 'Otherwise the tools are used up')}`,
    check(o, m) {
      const r = { errs: {} };
      r.sum = o.tools.length ? plural(o.tools.length, 'tool') : '';
      if (m.bodies.length < 2) r.error = 'There’s only one body: make another to combine with';
      else if (!o.target) r.need = 'Pick the target body';
      else if (goneBodies([o.target, ...o.tools], m)) r.error = 'A picked body is gone';
      else if (!o.tools.length) r.need = 'Pick the tool bodies';
      else {
        const box = id => bounds(facesOf([id], m).flatMap(f => f.p));
        const apart = o.tools.filter(id => !boxesMeet(box(o.target), box(id)));
        if (apart.length) {
          const who = bodyNames(apart, m) + (apart.length === 1 ? ' doesn’t' : ' don’t') + ' touch the target';
          if (o.op === 'int') r.error = who + ': nothing would be left';
          else if (o.op === 'sub') r.warn = who + ': nothing to subtract';
          else r.warn = who + ': the union will be in pieces';
        }
      }
      return r;
    },
    preview: o => ({
      marks: new Set(o.target ? ['body:' + o.target] : []),
      tint: new Map(o.tools.map(id => [id, { union: 'h', sub: 'x', int: 'a' }[o.op]])),
    }),
    apply(o, bodies) {
      const target = bodies.find(b => b.id === o.target), tools = bodies.filter(b => o.tools.includes(b.id));
      if (!target || o.keep) return;
      if (o.op === 'union') target.faces = [...target.faces, ...tools.flatMap(b => xformFaces(b.faces, XF.id))];
      for (const b of tools) bodies.splice(bodies.indexOf(b), 1);
    },
    row: (o, r, m) => ({ meta: labelOf(COMBINES, o.op), info: `${bodyNames([o.target], m)} with ${bodyNames(o.tools, m)} · ${labelOf(COMBINES, o.op)}${o.keep ? ' · tools kept' : ''}` }),
  },

  move: {
    label: 'Move', icon: 'move', needs: 'body',
    picks: {
      bodies: Pick('body', 'bodies', 'Click the bodies to move', { multi: true }),
      axis: Pick('axis', 'an axis', 'Click an origin axis or a straight edge to rotate about', { edges: true }),
    },
    init: m => ({ bodies: selBodies(m), dx: '0 mm', dy: '0 mm', dz: '0 mm', axis: 'axis-z', angle: '0°', copy: false, pick: 'bodies' }),
    body: (o, m, r) => `
      ${pickList(o, 'bodies', 'Bodies', bodyItems(o.bodies, m), 'Click bodies')}
      <h4>Translate</h4>
      ${numField(o, 'dx', 'X', r)}${numField(o, 'dy', 'Y', r)}${numField(o, 'dz', 'Z', r)}
      <h4>Rotate</h4>
      ${pickOne(o, 'axis', 'Axis', r.axis?.label, 'Click an axis or edge')}
      ${numField(o, 'angle', 'Angle', r)}
      ${tick(o, 'copy', 'Copy', 'Leave the original where it is')}`,
    check(o, m) {
      const r = { errs: {} }, e = r.errs;
      const v = ['dx', 'dy', 'dz'].map(k => readVal(o, k, e, { signed: true }));
      const a = readVal(o, 'angle', e, { unit: 'deg', signed: true, max: 360 });
      r.axis = axisOf(o.axis, m.bodies);
      r.sum = bodiesSum(o);
      if (!o.bodies.length) r.need = 'Pick the bodies to move';
      else if (goneBodies(o.bodies, m)) r.error = 'A picked body is gone';
      else if (a && o.axis && !r.axis) r.error = 'The axis is gone: pick another';
      else if (a && !r.axis) r.need = 'Pick an axis to rotate about';
      else if (!Object.keys(e).length && !a && v.every(x => x === 0)) r.need = 'Enter a distance or an angle';
      if (!Object.keys(e).length && (!a || r.axis)) {
        r.v = v; r.a = a;
        r.x = XF.then(a ? XF.turn(r.axis.p, r.axis.d, a) : XF.id, XF.move(v));
      }
      return r;
    },
    preview: (o, m, r) => ({ ...copiesPreview(o, m, r, [r.x], !o.copy), svg: r.a || o.pick === 'axis' ? axisPickSvg(o, 'axis', r.axis, [], m) : '' }),
    apply: (o, bodies, t, r) => copiesApply(o, bodies, t, [r.x], false, !o.copy),
    row: (o, r, m) => {
      const moved = r.v.some(x => x), parts = [];
      if (moved) parts.push(`by ${r.v.map(fmt).join(', ')} mm`);
      if (r.a) parts.push(`${fmt(r.a)}° about ${r.axis.label}`);
      return { meta: [moved && fmt(len(r.v)) + ' mm', r.a && fmt(r.a) + '°'].filter(Boolean).join(' '), info: `${bodyNames(o.bodies, m)} ${parts.join(', ')}${o.copy ? ' · copy' : ''}` };
    },
  },

  bmirror: {
    label: 'Mirror', icon: 'bmirror', needs: 'body',
    picks: {
      bodies: Pick('body', 'bodies', 'Click the bodies to mirror', { multi: true }),
      plane: Pick('plane', 'a plane', 'Click an origin plane or a planar face to mirror across'),
    },
    init: m => { const b = selBodies(m); return { bodies: b, plane: null, copy: true, pick: b.length ? 'plane' : 'bodies' }; },
    body: (o, m, r) => `
      ${pickList(o, 'bodies', 'Bodies', bodyItems(o.bodies, m), 'Click bodies')}
      ${pickOne(o, 'plane', 'Plane', r.plane?.label, 'Click a plane or face')}
      ${tick(o, 'copy', 'Copy', 'Keep the original too')}`,
    check(o, m) {
      const r = { errs: {} };
      r.plane = planeOf(o.plane, m.bodies);
      r.sum = bodiesSum(o);
      if (!o.bodies.length) r.need = 'Pick the bodies to mirror';
      else if (goneBodies(o.bodies, m)) r.error = 'A picked body is gone';
      else if (!o.plane) r.need = 'Pick a plane: an origin plane or a planar face';
      else if (!r.plane) r.error = 'The plane is gone: pick another';
      else r.x = XF.mirror(r.plane.p, r.plane.n);
      return r;
    },
    preview: (o, m, r) => {
      const pv = copiesPreview(o, m, r, [r.x], !o.copy);
      return { ...pv, planes: o.pick === 'plane', svg: r.plane ? planeSvg(r.plane, [...facesOf(o.bodies, m), ...(pv.faces || [])]) : '' };
    },
    apply: (o, bodies, t, r) => copiesApply(o, bodies, t, [r.x], false, !o.copy),
    row: (o, r, m) => ({ meta: r.plane.short, info: `${bodyNames(o.bodies, m)} across ${r.plane.label}${o.copy ? ' · copy' : ''}` }),
  },

  lpattern: {
    label: 'Linear pattern', icon: 'lpattern', needs: 'body',
    picks: {
      bodies: Pick('body', 'bodies', 'Click the bodies to pattern', { multi: true }),
      dir: Pick('axis', 'a direction', 'Click an origin axis or a straight edge for the direction', { edges: true }),
    },
    init: m => ({ bodies: selBodies(m), dir: 'axis-x', flip: false, count: '3', mode: 'spacing', dist: '100 mm', join: false, pick: 'bodies' }),
    body: (o, m, r) => `
      ${pickList(o, 'bodies', 'Bodies', bodyItems(o.bodies, m), 'Click bodies')}
      ${pickOne(o, 'dir', 'Direction', r.axis?.label, 'Click an axis or edge')}
      ${tick(o, 'flip', 'Flip direction')}
      <h4>Copies</h4>
      ${numField(o, 'count', 'Count', r)}
      ${choices(o, 'mode', [['spacing', 'Spacing'], ['total', 'Total']])}
      ${numField(o, 'dist', o.mode === 'spacing' ? 'Spacing' : 'Total', r)}
      ${tick(o, 'join', 'Join to original', 'One body; otherwise each copy is its own')}`,
    check(o, m) {
      const r = { errs: {} }, e = r.errs;
      const n = readVal(o, 'count', e, { unit: 'count', int: true, min: 2, max: 100 }), dist = readVal(o, 'dist', e);
      r.axis = axisOf(o.dir, m.bodies);
      r.sum = n ? `${n} in all` : '';
      if (!o.bodies.length) r.need = 'Pick the bodies to pattern';
      else if (goneBodies(o.bodies, m)) r.error = 'A picked body is gone';
      else if (!o.dir) r.need = 'Pick a direction: an origin axis or a straight edge';
      else if (!r.axis) r.error = 'The direction is gone: pick another';
      if (n != null && dist != null && r.axis) {
        r.n = n; r.step = o.mode === 'spacing' ? dist : dist / (n - 1);
        const d = o.flip ? mul(r.axis.d, -1) : r.axis.d;
        if (r.step * (n - 1) > 10000) e.dist = 'The pattern runs past 10 000 mm';
        r.xs = Array.from({ length: n - 1 }, (_, k) => XF.move(mul(d, r.step * (k + 1))));
        if (!r.error && !r.need && !o.join) {
          const along = facesOf(o.bodies, m).flatMap(f => f.p).map(p => dot(p, d)), ext = Math.max(...along) - Math.min(...along);
          if (r.step < ext - 1e-6) r.warn = `The copies overlap (${fmt(ext)} mm long this way): tick Join to original to merge them`;
        }
      }
      return r;
    },
    preview: (o, m, r) => ({ ...copiesPreview(o, m, r, r.xs || [], false), svg: axisPickSvg(o, 'dir', r.axis, [], m) }),
    apply: (o, bodies, t, r) => copiesApply(o, bodies, t, r.xs, o.join),
    row: (o, r) => ({ meta: '×' + r.n, info: `${r.n} × ${fmt(r.step)} mm along ${r.axis.label}${o.flip ? ', flipped' : ''}${o.join ? ' · joined' : ''}` }),
  },

  cpattern: {
    label: 'Circular pattern', icon: 'cpattern', needs: 'body',
    picks: {
      bodies: Pick('body', 'bodies', 'Click the bodies to pattern', { multi: true }),
      axis: Pick('axis', 'an axis', 'Click an origin axis or a straight edge to pattern about', { edges: true }),
    },
    init: m => ({ bodies: selBodies(m), axis: 'axis-z', count: '4', mode: 'full', angle: '90°', join: false, pick: 'bodies' }),
    body: (o, m, r) => `
      ${pickList(o, 'bodies', 'Bodies', bodyItems(o.bodies, m), 'Click bodies')}
      ${pickOne(o, 'axis', 'Axis', r.axis?.label, 'Click an axis or edge')}
      <h4>Copies</h4>
      ${numField(o, 'count', 'Count', r)}
      ${choices(o, 'mode', CIRC_MODES)}
      ${o.mode === 'full' ? '' : numField(o, 'angle', o.mode === 'spacing' ? 'Spacing' : 'Total', r)}
      ${tick(o, 'join', 'Join to original', 'One body; otherwise each copy is its own')}`,
    check(o, m) {
      const r = { errs: {} }, e = r.errs;
      const n = readVal(o, 'count', e, { unit: 'count', int: true, min: 2, max: 100 });
      const a = o.mode === 'full' ? 360 : readVal(o, 'angle', e, { unit: 'deg', max: 360 });
      r.axis = axisOf(o.axis, m.bodies);
      r.sum = n ? `${n} in all` : '';
      if (!o.bodies.length) r.need = 'Pick the bodies to pattern';
      else if (goneBodies(o.bodies, m)) r.error = 'A picked body is gone';
      else if (!o.axis) r.need = 'Pick an axis: an origin axis or a straight edge';
      else if (!r.axis) r.error = 'The axis is gone: pick another';
      if (n != null && a != null) {
        r.n = n; r.step = o.mode === 'full' ? 360 / n : o.mode === 'spacing' ? a : a / (n - 1);
        if (o.mode === 'spacing' && r.step * (n - 1) >= 360) e.angle = `${n} copies ${fmt(r.step)}° apart go past a full turn`;
        else if (o.mode === 'total' && a >= 360) e.angle = 'A whole turn puts the last copy on the first: use Full 360°';
        if (r.axis) r.xs = Array.from({ length: n - 1 }, (_, k) => XF.turn(r.axis.p, r.axis.d, r.step * (k + 1)));
      }
      return r;
    },
    preview: (o, m, r) => ({ ...copiesPreview(o, m, r, r.xs || [], false), svg: axisPickSvg(o, 'axis', r.axis, [], m) }),
    apply: (o, bodies, t, r) => copiesApply(o, bodies, t, r.xs, o.join),
    row: (o, r) => ({ meta: '×' + r.n, info: `${r.n} × ${fmt(r.step)}° about ${r.axis.label}${o.join ? ' · joined' : ''}` }),
  },

  fillet: {
    label: 'Fillet', icon: 'fillet', needs: 'bracket',
    picks: { edges: Pick('edge', 'edges', 'Click edges to fillet', { multi: true }) },
    init: m => ({ edges: holeRims(m), radius: '2 mm', chain: true, pick: 'edges' }),
    body: (o, m, r) => `
      ${pickList(o, 'edges', 'Edges', edgeItems(o.edges, m), 'Click edges')}
      ${numField(o, 'radius', 'Radius', r)}
      ${tick(o, 'chain', 'Tangent chain', 'Take in edges that run on smoothly')}`,
    check(o, m) {
      const r = edgeCheck(o, m, 'fillet'), v = readVal(o, 'radius', r.errs, { max: 1000 });
      const bad = v != null && r.es?.find(e => v >= edgeCap(e));
      if (bad) r.errs.radius = `Too big for ${bad.label}: under ${fmt(edgeCap(bad))} mm`;
      r.d = [v, v];
      return r;
    },
    preview: edgePreview,
    apply: edgeApply,
    row: (o, r) => ({ meta: 'R' + fmt(r.d[0]), info: `${plural(o.edges.length, 'edge')} · R${fmt(r.d[0])} mm${o.chain ? ' · Tangent chain' : ''}` }),
  },

  chamfer: {
    label: 'Chamfer', icon: 'chamfer', needs: 'bracket',
    picks: { edges: Pick('edge', 'edges', 'Click edges to chamfer', { multi: true }) },
    init: m => ({ edges: holeRims(m), type: 'equal', d1: '1 mm', d2: '2 mm', angle: '45°', flip: false, pick: 'edges' }),
    body: (o, m, r) => `
      ${pickList(o, 'edges', 'Edges', edgeItems(o.edges, m), 'Click edges')}
      <h4>Type</h4>
      ${choices(o, 'type', CHAMFERS)}
      ${numField(o, 'd1', o.type === 'two' ? 'Distance 1' : 'Distance', r)}
      ${o.type === 'two' ? numField(o, 'd2', 'Distance 2', r) : ''}
      ${o.type === 'angle' ? numField(o, 'angle', 'Angle', r) : ''}
      ${o.type === 'equal' ? '' : tick(o, 'flip', 'Flip sides')}`,
    check(o, m) {
      const r = edgeCheck(o, m, 'chamfer'), e = r.errs;
      const d1 = readVal(o, 'd1', e, { max: 1000 });
      let d2 = d1;
      if (o.type === 'two') d2 = readVal(o, 'd2', e, { max: 1000 });
      if (o.type === 'angle') {
        r.a = readVal(o, 'angle', e, { unit: 'deg', max: 90 });
        if (r.a === 90) { e.angle = 'Under 90°'; r.a = null; }
        d2 = r.a != null && d1 != null ? d1 * Math.tan(rad(r.a)) : null;
      }
      if (d1 != null && d2 != null) {
        r.d = o.type !== 'equal' && o.flip ? [d2, d1] : [d1, d2];
        const bad = r.es?.find(ed => ed.rim ? r.d[0] >= edgeCap(ed) : ed.sides.some((s, i) => r.d[i] >= widthIn(s, ed.a)));
        if (bad) e[o.type === 'angle' && d2 > d1 ? 'angle' : 'd1'] = `Too big for ${bad.label}: it has under ${fmt(edgeCap(bad))} mm of room`;
      }
      return r;
    },
    preview: edgePreview,
    apply: edgeApply,
    row: (o, r) => ({
      meta: o.type === 'equal' ? fmt(r.d[0]) + ' mm' : o.type === 'two' ? `${fmt(r.d[0])} × ${fmt(r.d[1])}` : `${fmt(parseFloat(o.d1))} mm ${fmt(r.a)}°`,
      info: `${plural(o.edges.length, 'edge')} · ${labelOf(CHAMFERS, o.type)} · ${o.type === 'angle' ? `${fmt(parseFloat(o.d1))} mm at ${fmt(r.a)}°` : r.d.map(fmt).join(' × ') + ' mm'}`,
    }),
  },

  shell: {
    label: 'Shell', icon: 'shell', needs: 'bracket',
    picks: { faces: Pick('face', 'faces to remove', 'Click faces to remove, or none for a closed hollow body', { multi: true }) },
    init: () => ({ faces: st.sel?.kind === 'face' ? [st.sel.id] : [], thick: '2 mm', dir: 'in', pick: 'faces' }),
    body: (o, m, r) => `
      ${pickList(o, 'faces', 'Remove', o.faces.map(id => ({ id, label: FACE_NAME[id] || 'Missing face', meta: FACE_INFO[id]?.[1] })), 'Click faces')}
      ${numField(o, 'thick', 'Thickness', r)}
      <h4>Direction</h4>
      ${choices(o, 'dir', [['in', 'Inward'], ['out', 'Outward']])}`,
    check(o, m) {
      const r = { errs: {} };
      r.t = readVal(o, 'thick', r.errs, { max: 100 });
      if (r.t != null && o.dir === 'in' && r.t >= 5) r.errs.thick = 'Too thick: the 10 mm walls need under 5 mm inward';
      r.sum = 'Bracket';
      r.fs = o.faces.map(id => m.br?.faces.find(f => f.id === id));
      if (!m.br) r.error = 'No body to shell';
      else if (r.fs.some(f => !f)) r.error = 'A picked face is gone';
      else if (!o.faces.length) r.warn = 'No faces removed: the body becomes closed and hollow';
      return r;
    },
    preview: (o, m, r) => ({
      marks: new Set(o.faces),
      svg: ready(r) ? r.fs.map(f => `<polygon class="band" points="${pts(inset(f.p, o.dir === 'in' ? r.t : -r.t))}"/>`).join('') : '',
    }),
    apply(o, bodies, t, r) { for (const f of r.fs) f.opening = o.dir === 'in' ? inset(f.p, r.t) : f.p; },
    row: (o, r) => ({ meta: fmt(r.t) + ' mm', info: `${o.faces.length ? plural(o.faces.length, 'face') + ' removed' : 'Closed'} · ${fmt(r.t)} mm ${o.dir === 'in' ? 'inward' : 'outward'}` }),
  },
};

function opPreview(m) {
  const o = st.op, def = OPS[o.kind];
  return def.preview(o, m, def.check(o, m));
}

function opPanel() {
  const o = st.op, def = OPS[o.kind], m = opCtx(), r = def.check(o, m);
  const msg = r.error ? `<div class="pmsg err">${r.error}</div>` : r.need ? `<div class="pmsg need">${r.need}</div>` : '';
  return `<div class="opp">
    <div class="opp-head">${icon(def.icon)}<b>${o.editing ? o.name : 'New ' + def.label.toLowerCase()}</b><span class="sum">${r.sum || ''}</span></div>
    <div class="opp-body">${def.body(o, m, r)}</div>
    <div class="opp-foot">
      ${msg}${r.warn ? `<div class="pmsg warn">${r.warn}</div>` : ''}
      <div class="pbtns">
        <button class="pbtn" data-act="op:op-cancel">Cancel</button>
        <button class="pbtn primary"${ready(r) ? ' data-act="op:op-ok"' : ' disabled'}>OK</button>
      </div>
    </div>
  </div>`;
}

// Starts setting up an operation, or editing one (the model rolls back to it).
function openOp(kind, editId) {
  if (st.mode === 'sketch') { toast('Finish the sketch first'); return; }
  const def = OPS[kind], t = editId && st.doc.timeline.find(t => t.id === editId);
  st.op = { kind, editing: t?.id };
  const m = opCtx();
  if ((def.needs === 'body' && !m.bodies.length) || (def.needs === 'bracket' && !m.br)) {
    st.op = null;
    toast(`${def.label} needs a body: extrude a sketch first`);
    return;
  }
  Object.assign(st.op, t ? { ...structuredClone(t.params), name: t.name, pick: Object.keys(def.picks)[0] } : def.init(m), { focus: true });
  Object.assign(st, { pick: false, sel: null });
}

// What a click in the view means for the panel's field of `type`, or null.
function pickValue(type, el) {
  const [kind, ...rest] = (el.dataset.pick || '').split(':'), v = rest.join(':'), face = el.dataset.face;
  switch (type) {
    case 'region': return kind === 'region' ? v : null;
    case 'axis': return kind === 'axis' || kind === 'line' || (kind === 'edge' && !v.startsWith('rim:')) ? v : null;
    case 'edge': return kind === 'edge' ? v : null;
    case 'body': return el.dataset.body || null;
    case 'plane': return face && (ORIGIN_PLANES[face] || FACE_NAME[face]) ? face : null;
    case 'face': return face && FACE_NAME[face] ? face : null;
  }
  return null;
}

// A click goes to the field picking; failing that, to another field that
// takes what was clicked (bodies only when their field is picking, so a
// stray click on the model never drops a body).
function opPick(el) {
  const o = st.op, def = OPS[o.kind];
  const names = [o.pick, ...Object.keys(def.picks).filter(k => k !== o.pick && def.picks[k].type !== 'body')].filter(Boolean);
  for (const name of names) {
    const p = def.picks[name], v = pickValue(p.type, el);
    if (v == null) continue;
    const refused = p.accept?.(o, v);
    if (typeof refused === 'string') { toast(refused); return; }
    if (p.multi) o[name] = o[name].includes(v) ? o[name].filter(x => x !== v) : [...o[name], v];
    else o[name] = v;
    // A single field, once filled, hands the clicks to the next empty one.
    o.pick = p.multi ? name : Object.keys(def.picks).find(k => def.picks[k].multi ? !o[k].length : o[k] == null) || null;
    return;
  }
  toast(def.picks[o.pick]?.hint || 'Click a field in the panel to pick into it');
}

function commitOp() {
  const o = st.op, def = OPS[o.kind], m = opCtx(), r = def.check(o, m);
  if (!ready(r)) { toast(r.error || Object.values(r.errs)[0] || r.need); return; }
  const { kind, editing, name, pick, focus, ...params } = o;
  const d = st.doc, row = { type: kind, params: structuredClone(params), ...def.row(params, r, m) };
  let id = editing;
  if (editing) Object.assign(d.timeline.find(t => t.id === editing), row);
  else {
    id = kind + Date.now();
    d.timeline.splice(d.rollback, 0, { id, name: `${def.label} ${d.timeline.filter(t => t.type === kind).length + 1}`, ...row });
    d.rollback++;
  }
  d.dirty = true;
  st.sel = { kind: 'feature', id };
  st.op = null;
}

// ---------------------------------------------------------------- welcome
function thumbGroups(kind) {
  const box = (x0, x1, y0, y1, z0, z1, holes = []) => [
    { n: [0, 0, 1], p: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], holes: holes.map(h => ({ near: h(z1), far: h(z0) })) },
    { n: [0, 0, -1], p: [[x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [x1, y0, z0]] },
    { n: [0, -1, 0], p: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]] },
    { n: [0, 1, 0], p: [[x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0]] },
    { n: [1, 0, 0], p: [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]] },
    { n: [-1, 0, 0], p: [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]] },
  ];
  const hc = (x, y, r) => z => circ(zc(z), x, y, r, 28);
  const slot = (x0, x1, y0, y1) => z => [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]];
  if (kind === 'bracket') return [BRACKET];
  if (kind === 'lid') {
    const holes = [[6, 6], [84, 6], [6, 54], [84, 54]].map(([x, y]) => hc(x, y, 2.5));
    for (let i = 0; i < 6; i++) holes.push(slot(30, 62, 18 + i * 5, 20 + i * 5));
    return [box(0, 90, 0, 60, 0, 7, holes)];
  }
  if (kind === 'spacer') {
    const r = 16, h = 34, n = 32, faces = [];
    for (let i = 0; i < n; i++) {
      const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, am = (a0 + a1) / 2;
      const P0 = [r * Math.cos(a0), r * Math.sin(a0)], P1 = [r * Math.cos(a1), r * Math.sin(a1)];
      faces.push({ n: [Math.cos(am), Math.sin(am), 0], smooth: true, p: [[...P0, 0], [...P1, 0], [...P1, h], [...P0, h]] });
    }
    faces.push({ n: [0, 0, 1], p: circ(zc(h), 0, 0, r, n), holes: [{ near: circ(zc(h), 0, 0, 6.5, 28), far: circ(zc(0), 0, 0, 6.5, 28) }] });
    faces.push({ n: [0, 0, -1], p: circ(zc(0), 0, 0, r, n) });
    return [faces];
  }
  if (kind === 'mount') {
    return [
      box(0, 100, 0, 60, 0, 8, [[7, 7], [93, 7], [7, 53], [93, 53]].map(([x, y]) => hc(x, y, 3))),
      box(15, 35, 20, 40, 8, 30, [hc(25, 30, 5)]),
      box(65, 85, 20, 40, 8, 30, [hc(75, 30, 5)]),
    ];
  }
  return [];
}

function thumb(kind) {
  const groups = thumbGroups(kind);
  const all = groups.flat().flatMap(f => f.p);
  const pr = makeProj(-58, 26, bounds(all).map(([a, b]) => (a + b) / 2));
  // The first group is the base; the rest sit on it and are painted far-to-near.
  const cen = g => depthOf(g.flatMap(f => f.p), pr);
  const [base, ...rest] = groups;
  const svg = [base, ...rest.sort((a, b) => cen(a) - cen(b))].map(g => solidSvg(g, pr, false)).join('');
  const [[x0, x1], [y0, y1]] = bounds(all.map(p => pr.P(...p)));
  const pad = 4;
  return `<svg viewBox="${x0 - pad} ${y0 - pad} ${x1 - x0 + pad * 2} ${y1 - y0 + pad * 2}">${svg}</svg>`;
}

// ---------------------------------------------------------------- render
// Everything is rebuilt on each change, so the focused panel field, its caret
// and the panel's scroll are carried over.
function render() {
  const a = document.activeElement, field = a?.dataset?.field, caret = field && [a.selectionStart, a.selectionEnd];
  const scroll = $('.opp-body')?.scrollTop;
  renderApp();
  drawGrid();
  const body = $('.opp-body');
  if (body && scroll) body.scrollTop = scroll;
  const el = field ? $(`.opp [data-field="${field}"]`) : st.op?.focus ? $('.opp input') : null;
  if (el) { el.focus(); if (field) el.setSelectionRange(...caret); else el.select(); }
  if (st.op) st.op.focus = false;
}

function renderApp() {
  const app = $('#app');
  const help = st.help ? helpModal() : '';
  if (st.screen === 'welcome') {
    app.innerHTML = titlebar() + welcome() + statusbar() + help;
    return;
  }
  const hint = st.doc.kind === 'empty' && !st.doc.timeline.length && st.mode === 'model' && !st.pick && !st.sel
    ? `<div class="hint-center">Select an origin plane, then <kbd>S</kbd> to sketch</div>` : '';
  app.innerHTML = titlebar() + toolbar() + `
    <div class="side">${side()}</div>
    ${rail()}${railPop()}
    <div class="vp">
      <canvas id="grid"></canvas>
      <svg id="scene" viewBox="${viewBox()}" preserveAspectRatio="xMidYMid meet">${sceneInner()}</svg>
      <div class="cube-wrap">
        <svg id="cube" class="cube" viewBox="0 0 116 116">${cubeInner()}</svg>
        <button class="home-btn" data-act="view:home" title="Home view">${icon('home')}</button>
      </div>
      ${st.op ? opPanel() : ''}
      ${hint}
    </div>` + (st.alt || st.gbarPinned ? gbar() : '') + statusbar() + help;
  placeRail();
}

// ---------------------------------------------------------------- actions
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

function isDark() {
  const t = root.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

function openDoc(kind, name, intro = true) {
  Object.assign(st, { screen: 'doc', doc: makeDoc(kind, name), mode: 'model', sketch: null, tool: null, pick: false, sel: null, menu: false });
  pivot = null;
  if (intro && !reduced) {
    Object.assign(cam, HOME, { yaw: HOME.yaw - 75, pitch: 8, zoom: 1.7 });
    requestAnimationFrame(() => animateCam(HOME, 1100));
  } else {
    Object.assign(cam, HOME);
  }
}

// New sketches go in at the marker, like any new feature.
function enterSketch(id, plane, isNew) {
  const d = st.doc;
  st.railOpen = null;
  if (isNew) {
    const n = d.timeline.filter(t => t.type === 'sketch').length + 1;
    id = 'n' + Date.now();
    d.timeline.splice(d.rollback, 0, { id, type: 'sketch', name: 'Sketch ' + n, meta: FACE_INFO[plane][0] === 'Origin plane' ? FACE_INFO[plane][1] : 'Face' });
    d.rollback++;
    d.dirty = true;
  }
  st.prevCam = { ...cam };
  Object.assign(st, { mode: 'sketch', sketch: { id, plane }, tool: null, pick: false, sel: null });
  animateCam(sketchCam(plane), 750);
}

function finishSketch() {
  Object.assign(st, { mode: 'model', sketch: null, tool: null, railOpen: null });
  animateCam(st.prevCam || HOME, 750);
}

function doOp(id) {
  if (id.startsWith('tool:')) { const t = id.slice(5); st.tool = st.tool === t ? null : t; return; }
  if (OPS[id]) { openOp(id); return; }
  if (id === 'op-ok') { commitOp(); return; }
  if (id === 'op-cancel') { st.op = null; return; }
  const d = st.doc;
  switch (id) {
    case 'sketch':
      if (st.sel && (st.sel.kind === 'face' || st.sel.kind === 'plane')) enterSketch(null, st.sel.id, true);
      else { st.pick = !st.pick; st.sel = null; }
      return;
    case 'finish': finishSketch(); return;
    case 'edit-sketch': enterSketch(st.sel.id, SKETCHES[st.sel.id]?.plane || 'plane-xy'); return;
    case 'hide': d.hidden.add(st.sel.id); st.sel = null; return;
    case 'edit-feature': {
      const t = d.timeline.find(t => t.id === st.sel.id);
      if (t?.params && OPS[t.type]) { openOp(t.type, t.id); return; }
      break;
    }
    case 'rollback': d.rollback = d.timeline.findIndex(t => t.id === st.sel.id) + 1; st.sel = null; return;
    case 'delete': {
      const i = d.timeline.findIndex(t => t.id === st.sel.id);
      d.timeline.splice(i, 1);
      if (i < d.rollback) d.rollback--;
      d.dirty = true;
      st.sel = null;
      return;
    }
  }
  const o = ops().find(o => o.id === id) || GLOBAL_FLAT.find(o => o.op === id);
  toast((o ? o.label : id) + ' — not wired up in the mock');
}

function faceClick(id) {
  if (st.mode === 'sketch') return;
  const kind = id.startsWith('hole') ? 'hole' : id.startsWith('plane') ? 'plane' : 'face';
  if (st.pick) {
    if (kind === 'hole') { toast('Pick a planar face'); return; }
    enterSketch(null, id, true);
    return;
  }
  st.sel = st.sel && st.sel.id === id ? null : { kind, id };
}

function act(a) {
  const [k, ...rest] = a.split(':');
  const v = rest.join(':');
  if (k !== 'menu') st.menu = false;
  if (k !== 'projmenu') st.projMenu = false;
  switch (k) {
    case 'new': openDoc('empty', 'Untitled'); break;
    case 'open': openDoc('bracket', v); break;
    case 'home': Object.assign(st, { screen: 'welcome', doc: null }); break;
    case 'menu': st.menu = !st.menu; break;
    case 'theme': root.dataset.theme = isDark() ? 'light' : 'dark'; break;
    case 'help': st.help = !st.help; break;
    case 'toast': toast(v); return;
    case 'projmenu': st.projMenu = !st.projMenu; break;
    case 'proj': st.persp = v === 'persp'; break;
    case 'mousehints': st.mouseHints = !st.mouseHints; break;
    case 'view':
      if (v === 'home') pivot = null;
      animateCam(v === 'home' ? HOME : { ...VIEWS[v], px: 0, py: 0 });
      return;
    case 'op': doOp(v); break;
    case 'opf': st.op.pick = v; break;
    case 'opc': { const [n, val] = v.split(':'); st.op[n] = val; break; }
    case 'opx': case 'opt': {
      // name, or name:id for one item of a list (edge ids have colons too).
      const i = v.indexOf(':'), n = i < 0 ? v : v.slice(0, i), id = v.slice(i + 1), o = st.op;
      if (i < 0) o[n] = !o[n];
      else if (Array.isArray(o[n])) o[n] = o[n].includes(id) ? o[n].filter(x => x !== id) : k === 'opt' ? [...o[n], id] : o[n];
      else o[n] = null;
      if (k === 'opx') o.pick = n;
      break;
    }
    case 'gop': altUsed = true; globalOp(v); break;
    case 'rail': st.railOpen = +v; break;
    case 'rgop': st.railOpen = null; globalOp(v); break;
    case 'tab': st.panel = v; break;
    case 'tl':
      if (st.mode === 'sketch' || st.op) return;
      st.pick = false;
      st.sel = st.sel?.id === v ? null : { kind: 'feature', id: v };
      break;
    case 'eye': {
      const h = st.doc.hidden;
      h.has(v) ? h.delete(v) : h.add(v);
      break;
    }
    case 'obj':
      if (st.op) {
        // Bodies and origin planes in the list can be picked into the panel too.
        const isBody = bodiesAt(activeFeatures()).some(b => b.id === v);
        if (isBody || v.startsWith('plane-')) opPick({ dataset: isBody ? { body: v } : { face: v } });
        break;
      }
      if (bodiesAt(activeFeatures()).some(b => b.id === v)) st.sel = { kind: 'body', id: v };
      else if (v.startsWith('plane-')) st.sel = { kind: 'plane', id: v };
      else if (st.doc.timeline.some(t => t.id === v)) st.sel = { kind: 'feature', id: v };
      else return;
      break;
    default: return;
  }
  render();
}

// ---------------------------------------------------------------- input
let drag = null, justDragged = false, altUsed = false, altDownAt = 0;

// Instant tooltips: a [data-tip] under the pointer shows one beside it, no delay.
document.addEventListener('mousemove', e => {
  const t = e.target.closest?.('[data-tip]'), tip = $('#tip');
  if (!t || drag) { tip.hidden = true; return; }
  const win = $('#win').getBoundingClientRect(), r = t.getBoundingClientRect();
  tip.innerHTML = t.dataset.tip + (t.dataset.key ? `<kbd>${t.dataset.key}</kbd>` : '');
  tip.style.left = (r.right - win.left + 6) + 'px';
  tip.style.top = (r.top + r.height / 2 - win.top) + 'px';
  tip.hidden = false;
});
document.addEventListener('mousedown', () => { $('#tip').hidden = true; });

// Pointing at a set opens its list. Pointing at a tool on a card closes it at
// once; anywhere else outside a set and its list closes it after a moment, so
// the pointer can cross the gap from a card to its list.
let railClose = 0;
const closeRail = () => { clearTimeout(railClose); railClose = 0; if (st.railOpen != null) { st.railOpen = null; render(); } };
document.addEventListener('mouseover', e => {
  if (drag) return;
  const set = e.target.closest('[data-rail]');
  if (set || e.target.closest('.rpop')) { clearTimeout(railClose); railClose = 0; }
  if (set) { if (st.railOpen !== +set.dataset.rail) { st.railOpen = +set.dataset.rail; render(); } }
  else if (st.railOpen == null || e.target.closest('.rpop')) return;
  else if (e.target.closest('.rtool')) closeRail();
  else if (!railClose) railClose = setTimeout(closeRail, 250);
});

document.addEventListener('click', e => {
  if (justDragged) return;
  if (st.railOpen != null && !e.target.closest('.rail, .rpop')) { st.railOpen = null; render(); }
  const el = e.target.closest('[data-act]');
  if (el) {
    if (el.dataset.act !== 'noop') act(el.dataset.act);
    return;
  }
  if (st.op && e.target.closest('#scene')) {
    // While an operation is set up, clicks in the view feed its panel.
    const p = e.target.closest('[data-pick], [data-face], [data-body]');
    st.menu = false;
    if (p) opPick(p);
    render();
    return;
  }
  const f = e.target.closest('[data-face]');
  if (f) { st.menu = false; faceClick(f.dataset.face); render(); return; }
  const b = e.target.closest('[data-body]');
  if (b && st.mode === 'model' && !st.pick) { st.menu = false; st.sel = { kind: 'body', id: b.dataset.body }; render(); return; }
  if (e.target.closest('#scene') && st.screen === 'doc') {
    if (st.mode === 'sketch' && st.tool) toast(TOOLS[st.tool].hint + ' — drawing not in mock');
    else st.sel = null;
    st.menu = st.projMenu = false;
    render();
  } else if ((st.menu || st.projMenu) && !e.target.closest('.file, .projdd')) { st.menu = st.projMenu = false; render(); }
});

document.addEventListener('dblclick', e => {
  if (st.screen !== 'doc' || st.mode === 'sketch' || st.op) return;
  // Double-clicking the model selects the whole body.
  const f = e.target.closest('.face, .hole');
  if (f) { st.sel = { kind: 'body', id: f.dataset.body || 'body' }; render(); return; }
  const r = e.target.closest('[data-act^="tl:"], [data-act^="obj:"]');
  if (!r) return;
  const id = r.dataset.act.split(':')[1];
  const t = st.doc.timeline.find(t => t.id === id);
  if (!t) return;
  if (t.type === 'sketch') enterSketch(t.id, SKETCHES[t.id]?.plane || 'plane-xy');
  else if (t.params && OPS[t.type]) openOp(t.type, t.id);
  else toast('Edit ' + t.name + ' — not wired up in the mock');
  render();
});

// Timeline drag and drop: rows reorder, the marker sets the rollback point.
let dnd = null;
const clearDrop = () => document.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-drag]');
  if (!el) return;
  dnd = { from: +el.dataset.idx };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', el.dataset.id || 'marker');
  requestAnimationFrame(() => el.classList.add('dragging'));
});
// The insertion point is a gap between items; it's always drawn as a line
// above the item after the gap (or below the last one), so each gap has
// exactly one look. Anywhere below the list means "at the end".
document.addEventListener('dragover', e => {
  if (!dnd) return;
  const list = e.target.closest('.list');
  clearDrop();
  if (!list) { dnd.to = null; return; }
  e.preventDefault();
  const items = [...list.querySelectorAll('.tl-item')];
  const el = e.target.closest('.tl-item');
  let to = items.length;
  if (el) {
    const r = el.getBoundingClientRect();
    to = +el.dataset.idx + (e.clientY > r.top + r.height / 2 ? 1 : 0);
  }
  dnd.to = to;
  if (to < items.length) items[to].classList.add('drop-before');
  else items[items.length - 1].classList.add('drop-after');
});
document.addEventListener('drop', e => {
  if (!dnd || dnd.to == null) return;
  e.preventDefault();
  const d = st.doc;
  const seq = [...d.timeline.slice(0, d.rollback), { marker: true }, ...d.timeline.slice(d.rollback)];
  const [item] = seq.splice(dnd.from, 1);
  seq.splice(dnd.to > dnd.from ? dnd.to - 1 : dnd.to, 0, item);
  d.rollback = seq.findIndex(t => t.marker);
  d.timeline = seq.filter(t => !t.marker);
  d.dirty = true;
  dnd = null;
  render();
});
document.addEventListener('dragend', () => {
  dnd = null;
  clearDrop();
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
});

const unitsPerPx = () => {
  const s = $('#scene').getBoundingClientRect();
  return Math.max(380 * cam.zoom / s.width, 250 * cam.zoom / s.height);
};

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#scene')) return;
  if (st.alt) altUsed = true;
  // No autoscroll on a middle press: it orbits, or picks the pivot.
  if (e.button === 1) e.preventDefault();
  drag = { x: e.clientX, y: e.clientY, b: e.button, moved: false, cam: { ...cam } };
});
// The pivot's marker shows while the pointer is over the view cube.
document.addEventListener('mouseover', e => {
  const over = !!e.target.closest?.('#cube');
  if (over === cubeHover) return;
  cubeHover = over;
  if (!pivot) return;
  // Off the cube, it fades from now.
  if (!over) pivot.at = performance.now() - PIVOT_SHOWN;
  fadePivot();
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    cancelAnimationFrame(camAnim);
    document.body.classList.add('dragging');
  }
  // The left and middle buttons orbit, about the pivot if one was picked:
  // the pan keeps it where it shows. The right one pans.
  if (drag.b !== 2) {
    cam.yaw = drag.cam.yaw - dx * 0.4;
    cam.pitch = clamp(drag.cam.pitch + dy * 0.4, -90, 90);
    if (pivot) {
      const D = st.persp ? eyeDistance() : Infinity;
      const [x0, y0] = makeProj(drag.cam.yaw, drag.cam.pitch, st.doc.T, D).P(...pivot.p);
      const [x1, y1] = makeProj(cam.yaw, cam.pitch, st.doc.T, D).P(...pivot.p);
      cam.px = drag.cam.px + x1 - x0;
      cam.py = drag.cam.py + y1 - y0;
    }
  } else {
    const k = unitsPerPx();
    cam.px = drag.cam.px - dx * k;
    cam.py = drag.cam.py - dy * k;
  }
  queueRedraw();
});
window.addEventListener('pointerup', e => {
  if (drag?.moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 0); }
  // A middle click picks the point to orbit about, or off the model and the grid none.
  else if (drag?.b === 1 && e.button === 1 && st.screen === 'doc') setPivot(pointAt(e.clientX, e.clientY));
  drag = null;
  document.body.classList.remove('dragging');
});
addEventListener('resize', () => queueRedraw());
document.addEventListener('contextmenu', e => { if (e.target.closest('#scene')) e.preventDefault(); });
document.addEventListener('wheel', e => {
  const s = e.target.closest('#scene');
  if (!s) return;
  e.preventDefault();
  cancelAnimationFrame(camAnim);
  // Zoom towards the cursor: keep the point under it fixed.
  const at = () => { const p = s.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(s.getScreenCTM().inverse()); };
  const before = at();
  cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * 0.0012), 0.25, 4);
  s.setAttribute('viewBox', viewBox());
  const after = at();
  cam.px += before.x - after.x;
  cam.py += before.y - after.y;
  queueRedraw();
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.key === 'Alt') {
    e.preventDefault();
    if (!e.repeat && st.screen === 'doc') { st.alt = true; altUsed = false; altDownAt = performance.now(); render(); }
    return;
  }
  if (e.target.matches?.('.opp input')) {
    // Typing in a panel field: Enter is OK, Esc Cancel, the rest is text.
    if (e.key === 'Enter') { e.preventDefault(); commitOp(); render(); }
    else if (e.key === 'Escape') { st.op = null; render(); }
    return;
  }
  if (e.altKey) altUsed = true;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '?') { st.help = !st.help; render(); return; }
  if (st.help) { if (e.key === 'Escape') { st.help = false; render(); } return; }

  const key = e.key === 'Delete' ? 'Del' : e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (st.screen === 'welcome') {
    if (key === 'N') { openDoc('empty', 'Untitled'); render(); }
    if (key === 'O') { openDoc('bracket', 'bracket'); render(); }
    return;
  }
  if (st.railOpen != null) {
    const items = railSets()[st.railOpen][1], i = railLetters(items).indexOf(key);
    if (i >= 0) { e.preventDefault(); act('rgop:' + items[i].op); return; }
  }
  const set = key.length === 1 ? RAIL_SET_KEYS.indexOf(key) : -1;
  if (set >= 0 && railSets()[set]) { st.railOpen = st.railOpen === set ? null : set; render(); return; }
  if (e.key === 'Escape') {
    if (st.railOpen != null) st.railOpen = null;
    else if (st.menu) st.menu = false;
    else if (st.projMenu) st.projMenu = false;
    else if (st.gbarPinned) st.gbarPinned = false;
    else if (st.op) st.op = null;
    else if (st.tool) st.tool = null;
    else if (st.pick) st.pick = false;
    else if (st.sel) st.sel = null;
    else if (st.mode === 'sketch') finishSketch();
    render();
    return;
  }
  if (e.key === ' ' && st.sel && !st.op) { e.preventDefault(); st.sel = null; render(); return; }
  const o = ops().find(o => o.key === key);
  if (o) { e.preventDefault(); doOp(o.id); render(); }
});

document.addEventListener('input', e => {
  const f = e.target.dataset?.field;
  if (!f || !st.op) return;
  st.op[f] = e.target.value;
  render();
});

document.addEventListener('keyup', e => {
  if (e.key !== 'Alt') return;
  e.preventDefault();
  if (!st.alt) return;
  st.alt = false;
  // A quick tap on its own pins the bar open (or closes it again).
  if (!altUsed && performance.now() - altDownAt < 300) st.gbarPinned = !st.gbarPinned;
  render();
});
window.addEventListener('blur', () => { if (st.alt) { st.alt = false; render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

// Deep links for screenshots (listed in the header comment).
{
  const [doc, view] = location.hash.slice(1).split('/');
  if (location.hash.endsWith('/still')) root.classList.add('still');
  if (doc === 'empty') openDoc('empty', 'Untitled', false);
  if (doc === 'bracket') {
    openDoc('bracket', 'bracket', false);
    if (view === 'face') st.sel = { kind: 'face', id: 'base-top' };
    if (view === 'body') st.sel = { kind: 'body', id: 'body' };
    if (view === 'sketch' || view === 'sketchtools') {
      Object.assign(st, { mode: 'sketch', sketch: { id: 's1', plane: 'side' } });
      Object.assign(cam, sketchCam('side'));
    }
  }
  if (view === 'tools' || view === 'sketchtools') st.gbarPinned = true;
  if (location.hash.includes('/dark')) root.dataset.theme = 'dark';
  if (location.hash.includes('/light')) root.dataset.theme = 'light';
  if (location.hash.includes('/persp')) st.persp = true;
  if (location.hash.includes('/projmenu')) st.projMenu = true;
  if (location.hash.includes('/nomouse')) st.mouseHints = false;
  for (const v of Object.keys(VIEWS)) if (location.hash.includes('/v-' + v)) Object.assign(cam, VIEWS[v]);
  const kind = doc === 'bracket' && view?.startsWith('op:') && view.slice(3);
  if (OPS[kind]) {
    const E = (a, b) => [a, b].sort().join('|');
    if (kind === 'combine') {
      // A mirrored copy to combine with.
      const d = st.doc;
      d.timeline.push({ id: 'dm', type: 'bmirror', name: 'Mirror 1', meta: 'Base end', info: 'Bracket across Base end · copy', params: { bodies: ['body'], plane: 'base-x', copy: true } });
      d.rollback++;
      Object.assign(cam, { zoom: 1.1, px: 40 });
    }
    if (kind === 'lpattern' || kind === 'cpattern') Object.assign(cam, { zoom: 1.6, px: kind === 'lpattern' ? 60 : 0 });
    openOp(kind);
    Object.assign(st.op, {
      revolve: { regions: ['s1:0'], axis: 's1:l5', extent: 'one', a1: '270°', flip: true, pick: null, ...(location.hash.includes('/join') && { op: 'join' }) },
      combine: { tools: ['dm:0:0'] },
      move: { dx: '-20 mm', dy: '-80 mm', angle: '30°' },
      bmirror: { plane: 'plane-yz', pick: null },
      fillet: { edges: [E('base-x', 'base-top'), E('base-top', 'side'), E('up-top', 'up-x'), 'rim:hole-a:base-top', E('back', 'up-top'), E('side', 'up-top')], radius: '3 mm' },
      chamfer: { edges: [E('base-x', 'base-top'), E('base-x', 'side')], type: 'angle', d1: '3 mm', angle: '30°' },
      shell: { faces: ['up-top', 'base-x'] },
    }[kind] || {}, { focus: false });
  }
}
render();
</script>
</body>
</html>
