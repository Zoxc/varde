<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varde UI Mock</title>
<!--
  Interactive mock of the varde shell. Open directly in a browser.

  Try: open a recent file, drag to orbit (right-drag pans, wheel zooms,
  middle-click the model or grid to orbit about that point),
  click faces, double-click to select the body, hold Alt (swaps
  timeline/objects), drag timeline rows or the rollback marker, double-click
  a sketch in the timeline, S to sketch, Esc to back out, click the view
  cube, ? for shortcuts.
  Solid operations (Revolve O, Chamfer C, Combine B, Move M, Pattern P, and
  Shell, Mirror, Circular pattern from the Alt bar or with a body selected)
  open a panel at the viewport's right; click its fields, then the model.
  The tool rail floats over the view's left edge with a card per tool set
  (the Alt bar's sets): point at a set, click it or press its key (Q, W,
  E, ... from the top) to open its full list beside it, then a letter
  picks a tool; the first tools of each set sit on the card too, with
  instant tooltips. The set's key shows in its open list.
  Deep links: #bracket, #bracket/face, #bracket/body, #bracket/sketch,
  #bracket/tools, #bracket/sketchtools, #empty; #bracket/op:<kind> opens an
  operation set up for a screenshot (revolve, combine, move, bmirror,
  lpattern, cpattern, fillet, chamfer, shell); append /still to disable
  animations, /dark or /light to force the theme, /v-top (any view cube
  view) to set the camera, /persp for a perspective view, /projmenu to
  open the status bar's menu, /nomouse to hide the mouse hints.
-->
<style>
:root {
  --side-w: 256px;
  --rail-w: 56px;
  --title-h: 36px;
  --tool-h: 40px;
  --status-h: 0px;   /* the status bar floats over the view rather than take a strip */
  --status-float: 30px;
  --accent: #0a95ad;
  --accent-soft: rgba(10, 149, 173, .13);
  --hl: #e3f5da;
  --hl-line: #9dd488;
  --c-sketch: #0a95ad;
  --c-solid: #8a6fc4;
  --c-cons: #e0861a;
  --c-insp: #13a08f;
  --i-sketch: #0a95ad; --i-mod: #cf3f30; --i-cstr: #8a3fd0; --i-dim: #5f6b80;
  --i-solid: #c0409a; --i-cons: #c39000; --i-insp: #2f9a47;
  --ia-sketch: #e88a00; --ia-mod: #2f6fd8; --ia-cstr: #e88a00; --ia-dim: #e88a00;
  --ia-solid: #0d9a88; --ia-cons: #2f6fd8; --ia-insp: #e88a00;
  --logo-a: #5e4a93;
  --logo-b: #9a88c8;
  --logo-dot: #5dbf4a;
  --text: #2b3036;
  --muted: #6c747d;
  --faint: #9aa2ab;
  --desk: radial-gradient(1200px 700px at 15% 10%, #e1dcec, transparent 60%), radial-gradient(900px 600px at 90% 90%, #d8e8d8, transparent 60%), linear-gradient(135deg, #d8dce6, #c9d0dc);
  --title-bg: #e9ebef;
  --panel: #fafafb;
  --tabstrip: #eef0f3;
  --vp-top: #f7f7f9;
  --vp-bot: #dfe1e6;
  --line: rgba(20, 30, 40, .11);
  --chip: rgba(20, 30, 40, .07);
  --edge: #34303f;
  --wall: #4a4556;
  --through: #e3e5e9;
  --ok: #3d9b35;
  --halo: #f4f4f7;
  --danger: #cf4330;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #39b9cf;
    --accent-soft: rgba(57, 185, 207, .16);
    --hl: rgba(118, 204, 96, .15);
    --hl-line: rgba(118, 204, 96, .5);
    --c-sketch: #39b9cf;
    --c-solid: #a896d6;
    --c-cons: #f0a24a;
    --c-insp: #3fcfbd;
    --i-sketch: #3cc3d9; --i-mod: #ff7a66; --i-cstr: #b48cff; --i-dim: #a6b2c6;
    --i-solid: #ef77c2; --i-cons: #f0c43c; --i-insp: #62cf7c;
    --ia-sketch: #ffad33; --ia-mod: #78aaff; --ia-cstr: #ffad33; --ia-dim: #ffad33;
    --ia-solid: #3fd3bf; --ia-cons: #78aaff; --ia-insp: #ffad33;
    --logo-a: #7d6bb3;
    --logo-b: #b3a6dc;
    --logo-dot: #76d062;
    --text: #e4e7ea;
    --muted: #9aa3ac;
    --faint: #69727c;
    --desk: radial-gradient(1200px 700px at 15% 10%, #26213a, transparent 60%), radial-gradient(900px 600px at 90% 90%, #1b2a1f, transparent 60%), linear-gradient(135deg, #14151b, #0e1013);
    --title-bg: #17181d;
    --panel: #212228;
    --tabstrip: #1b1c21;
    --vp-top: #2b2c32;
    --vp-bot: #1a1b1f;
    --line: rgba(255, 255, 255, .08);
    --chip: rgba(255, 255, 255, .08);
    --edge: #0e0d12;
    --wall: #221f29;
    --through: #1f2024;
    --ok: #5cc052;
    --halo: #24252b;
    --danger: #f07563;
  }
}
:root[data-theme="dark"] {
  --accent: #39b9cf;
  --accent-soft: rgba(57, 185, 207, .16);
  --hl: rgba(118, 204, 96, .15);
  --hl-line: rgba(118, 204, 96, .5);
  --c-sketch: #39b9cf;
  --c-solid: #a896d6;
  --c-cons: #f0a24a;
  --c-insp: #3fcfbd;
  --i-sketch: #3cc3d9; --i-mod: #ff7a66; --i-cstr: #b48cff; --i-dim: #a6b2c6;
  --i-solid: #ef77c2; --i-cons: #f0c43c; --i-insp: #62cf7c;
  --ia-sketch: #ffad33; --ia-mod: #78aaff; --ia-cstr: #ffad33; --ia-dim: #ffad33;
  --ia-solid: #3fd3bf; --ia-cons: #78aaff; --ia-insp: #ffad33;
  --logo-a: #7d6bb3;
  --logo-b: #b3a6dc;
  --logo-dot: #76d062;
  --text: #e4e7ea;
  --muted: #9aa3ac;
  --faint: #69727c;
  --desk: radial-gradient(1200px 700px at 15% 10%, #26213a, transparent 60%), radial-gradient(900px 600px at 90% 90%, #1b2a1f, transparent 60%), linear-gradient(135deg, #14151b, #0e1013);
  --title-bg: #17181d;
  --panel: #212228;
  --tabstrip: #1b1c21;
  --vp-top: #2b2c32;
  --vp-bot: #1a1b1f;
  --line: rgba(255, 255, 255, .08);
  --chip: rgba(255, 255, 255, .08);
  --edge: #0e0d12;
  --wall: #221f29;
  --through: #1f2024;
  --ok: #5cc052;
  --halo: #24252b;
  --danger: #f07563;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--desk);
  color: var(--text);
  font: 12.5px/1.35 system-ui, "Inter", "Segoe UI", sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  display: grid; place-items: center;
}
button { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
/* Tool icons: notes/ui-mock-icons.html's defaults, the "outline with
   accents, line only" set in its Distinct colours with purple constraints
   and the softer accent. A tool is drawn in its category's colour (--cc,
   darkened for some), its accent marks (.a, hollow dots .af) in the
   category's accent mixed 60% toward it, and reference geometry (.r) in a
   grey tinted 8% toward it. */
svg.c-sketch { --cc: var(--i-sketch); --ca: var(--ia-sketch); }
svg.c-mod { --cc: color-mix(in srgb, var(--i-mod) 90%, #000); --ca: var(--ia-mod); }
svg.c-cstr { --cc: color-mix(in srgb, var(--i-cstr) 88%, #000); --ca: var(--ia-cstr); }
svg.c-dim { --cc: color-mix(in srgb, var(--i-dim) 85%, #000); --ca: var(--ia-dim); }
svg.c-solid { --cc: var(--i-solid); --ca: var(--ia-solid); }
svg.c-cons { --cc: color-mix(in srgb, var(--i-cons) 92%, #000); --ca: var(--ia-cons); }
svg.c-insp { --cc: var(--i-insp); --ca: var(--ia-insp); }
svg.i[class*=" c-"] { color: var(--cc); }
svg.i :is(.a, .af) { stroke: color-mix(in srgb, var(--ca) 60%, var(--cc)); }
svg.i .af { fill: var(--panel); stroke-width: 1.5; }
svg.i .r { stroke: color-mix(in srgb, color-mix(in srgb, var(--text) 52%, var(--panel)) 92%, var(--cc)); }
svg.i .tx { fill: var(--cc); stroke: none; }
kbd {
  font: 500 10.5px/1 ui-monospace, "SF Mono", Menlo, monospace;
  padding: 3px 5px; border-radius: 4px;
  background: var(--chip); color: var(--muted);
  border: 1px solid var(--line);
}

/* ---- window ---- */
#win {
  position: relative; overflow: hidden;
  width: min(1480px, calc(100vw - 56px)); height: min(920px, calc(100vh - 56px));
  border-radius: 12px; background: var(--panel);
  box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08), 0 30px 80px rgba(20, 15, 40, .32);
}
#app { position: absolute; inset: 0; }

.titlebar {
  position: absolute; top: 0; left: 0; right: 0; height: var(--title-h); z-index: 12;
  display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px;
  background: var(--title-bg); border-bottom: 1px solid var(--line);
}
.titlebar .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; }
.titlebar .title { position: absolute; left: 50%; transform: translateX(-50%); color: var(--muted); white-space: nowrap; }
.titlebar .title b { color: var(--text); font-weight: 600; }
.winctl { display: flex; gap: 8px; margin-left: 4px; }
.winctl button {
  width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--chip); color: var(--muted);
}
.winctl button:hover { background: var(--hl); color: var(--text); }
.winctl button.close:hover { background: #e0564b; color: #fff; }
.winctl svg.i { width: 11px; height: 11px; stroke-width: 2; }
.logo { width: 18px; height: 18px; flex: none; }
.logo .la { fill: var(--logo-a); stroke: var(--logo-a); }
.logo .lb { fill: var(--logo-b); stroke: var(--logo-b); }
.logo .la, .logo .lb { stroke-width: 1.1; stroke-linejoin: round; }
.logo .ld { fill: var(--logo-dot); }

.toolbar {
  position: absolute; top: var(--title-h); left: 0; right: 0; height: var(--tool-h); z-index: 11;
  display: flex; align-items: center; gap: 2px; padding-right: 8px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.file {
  position: relative; flex: none; width: calc(var(--side-w) - var(--save-w) - 2px); height: 100%;
  display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px;
  border-right: 1px solid var(--line); cursor: pointer;
}
.file:hover { background: var(--hl); }
.file .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.file .ext { color: var(--faint); font-weight: 400; }
.file .dirty { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
.file .chev { margin-left: auto; color: var(--muted); }
/* With the file cell and the toolbar's 2px gap, as wide as the side panel
   under them. */
.toolbar { --save-w: 38px; }
.save-cell { display: flex; align-items: center; justify-content: center; flex: none; width: var(--save-w); height: 100%; border-right: 1px solid var(--line); }
.ctx { display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 100%; font-weight: 600; border-right: 1px solid var(--line); }
.wash { display: flex; align-items: center; height: 24px; margin-left: -8px; border-radius: 6px; overflow: hidden; background: var(--accent-soft); }
.wash > span { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.wash .op.finish { border-radius: 0; }
.tag { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-radius: 5px; padding: 2px 7px; font-size: 11px; }
.ops { display: flex; align-items: center; gap: 2px; padding: 0 6px; min-width: 0; }
.op {
  display: flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 8px;
  border: 0; border-radius: 6px; background: none; cursor: pointer;
}
.op:hover { background: var(--hl); }
.op .k { color: var(--faint); font: 500 10.5px ui-monospace, Menlo, monospace; }
.op.on { background: var(--accent-soft); color: var(--accent); }
.op.on .k { color: var(--accent); opacity: .7; }
.op.primary { background: var(--accent); color: #fff; }
.op.primary:hover { filter: brightness(1.08); }
.op.finish { height: 24px; padding: 0 5px; }
.op.icon { padding: 0 6px; color: var(--muted); height: 26px; }
.op.icon:hover { color: var(--text); }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex: none; }
.spacer { flex: 1; }
.ops.enter .op { animation: opIn .2s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 16ms); }
@keyframes opIn { from { opacity: 0; transform: translateY(-3px); } }

@media (max-width: 1380px) { .ops .op:not(.primary) .lbl, .ops .op .k { display: none; } .ops .op { padding: 0 7px; } }
@media (max-width: 1660px) { .ops.many .op:not(.primary) .lbl, .ops.many .op .k { display: none; } .ops.many .op { padding: 0 7px; } }

.sbar {
  position: absolute; bottom: 10px; right: 12px; z-index: 11;
  max-width: calc(100% - var(--side-w) - var(--rail-w) - 36px);
  display: flex; align-items: center; gap: 8px;
}
.statusbar, .selbox {
  height: var(--status-float); min-width: 0;
  display: flex; align-items: center; gap: 12px; padding: 0 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  font-size: 12px; color: var(--muted); white-space: nowrap;
}
.selbox .h { flex: none; }
.statusbar .sep, .selbox .sep { flex: none; width: 1px; height: 16px; background: var(--line); }
.info { display: flex; align-items: center; gap: 8px; color: var(--text); min-width: 0; overflow: hidden; }
.projdd { position: relative; flex: none; }
.sb-btn { flex: none; height: 24px; min-width: 24px; display: flex; align-items: center; justify-content: center; gap: 1px; padding: 0 4px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
.sb-btn:hover, .projdd.open > .sb-btn { background: var(--hl); color: var(--text); }
.sb-btn svg.i { width: 16px; height: 16px; }
.sb-btn svg.chev { width: 11px; height: 11px; }
.statusbar > .projdd:last-child { margin-right: -7px; }
.statusbar > .projdd:first-child { margin-left: -7px; }
.projdd .menu { top: auto; bottom: calc(100% + 6px); left: auto; right: -7px; width: 180px; }
.projdd .menu button { color: var(--text); font: inherit; }
.projdd .menu svg.i { width: 16px; height: 16px; color: var(--muted); }
.projdd .menu svg.tick { margin-left: auto; color: var(--accent); visibility: hidden; }
.projdd .menu .on svg.tick { visibility: visible; }
.projdd .menu .mi { width: 16px; display: flex; justify-content: center; }
.info .muted { color: var(--muted); }
.info .accent { color: var(--accent); font-weight: 600; }
.info .dotok { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.info svg.i { width: 14px; height: 14px; }
.hints { display: flex; align-items: center; gap: 14px; }
.h { display: flex; align-items: center; gap: 5px; }
.mouse { width: 11px; height: 15px; color: var(--muted); }
.mouse rect { fill: none; stroke: currentColor; stroke-width: 1; }
.mouse .b { fill: var(--accent); }

/* ---- tool bar (Alt) ---- */
.gbar {
  position: absolute; top: calc(var(--title-h) + var(--tool-h)); left: var(--side-w); right: 0; z-index: 12;
  display: flex; align-items: stretch; padding: 0 4px 6px; overflow-x: auto;
  background: var(--panel); border-bottom: 1px solid var(--line);
  box-shadow: 0 8px 20px rgba(0, 0, 0, .10);
}
.grp { display: flex; flex-direction: column; align-items: center; padding: 0 4px; border-right: 1px solid var(--line); }
.grp:last-child { border-right: 0; }
.grp .gl { align-self: stretch; margin: 0 -4px 4px; padding: 4px 0; text-align: center; font-weight: 600; color: var(--muted); background: var(--tabstrip); border-bottom: 1px solid var(--line); }
.grp .btns { display: flex; gap: 2px; }
.gbtn {
  min-width: 50px; height: 54px; padding: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 0; border-radius: 6px; background: none; cursor: pointer; white-space: nowrap;
}
.gbtn:hover { background: var(--hl); }
.gbtn svg.i { width: 24px; height: 24px; stroke-width: 1.45; }

/* ---- tool rail: a card per tool set floating over the view's left edge, its
   main tools on a recessed strip flush along the card's bottom ---- */
.rail {
  /* cards 48 px wide, 6 px from the side panel and from the toolbar; the side
     padding also keeps the cards' outline inside the rail, which clips */
  position: absolute; top: calc(var(--title-h) + var(--tool-h)); left: calc(var(--side-w) + 2px); bottom: var(--status-h); width: var(--rail-w); z-index: 8;
  display: flex; flex-direction: column; gap: 6px; padding: 6px 4px; overflow: hidden;
  pointer-events: none; /* clicks between the cards reach the view */
}
.rail > * { pointer-events: auto; }
.rcard { flex: none; border-radius: 8px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.rset {
  /* square, so its hover fills the card's whole white head; the card's rounded clip shapes it */
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 5px;
  border: 0; border-radius: 0; background: none; cursor: pointer;
}
.rset:hover { background: var(--hl); }
/* over a strip, the head runs on under the strip's rounded top corners, so its
   highlight leaves no white wedges there */
.rset:not(:last-child) { padding-bottom: 11px; margin-bottom: -6px; }
.rtools { position: relative; }
.rset.on { background: var(--hl); } /* open (it opens on hover) looks like hover, as on the tools */
.rset svg.i { width: 22px; height: 22px; }
.rtools { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 0; border-radius: 6px; background: color-mix(in srgb, var(--text) 6%, var(--panel)); } /* opaque: the head's highlight runs on under it */
.rtool { width: 28px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; cursor: pointer; }
.rtool:hover { background: var(--hl); }
.rtool svg.i { width: 18px; height: 18px; }
/* instant tooltips for the rail's tools, beside them (outside the rail, which clips) */
.tip { position: absolute; z-index: 60; display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px;
  background: var(--text); color: var(--vp-top); font-size: 12px; white-space: nowrap; pointer-events: none; transform: translateY(-50%); }
.tip kbd { background: rgba(255, 255, 255, .15); color: inherit; border-color: transparent; padding: 1px 4px; font-size: 10px; }
.tip[hidden] { display: none; }
/* a set's tools, opened from its card: only as tall as it needs, beside the card */
.rpop {
  position: absolute; left: calc(var(--side-w) + var(--rail-w) + 12px); z-index: 13; width: 230px; max-height: calc(100% - var(--title-h) - var(--tool-h) - var(--status-h) - 16px);
  overflow: auto; padding: 8px; border-radius: 10px; border-top: 3px solid var(--rc);
  background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, .18);
}
.rpop .hd { display: flex; align-items: center; gap: 6px; padding: 2px 4px 6px; font-weight: 600; }
.rpop .hd kbd { margin-left: auto; }
.rpop .hd kbd.own { margin-left: 0; } /* the set's own key, after its name */
.rpop button { width: 100%; display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 6px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; }
.rpop button:hover { background: var(--hl); }
.rpop button .k { margin-left: auto; color: var(--faint); font: 500 10.5px ui-monospace, Menlo, monospace; }

/* ---- menu ---- */
.menu {
  position: absolute; top: calc(100% + 4px); left: 8px; width: 240px; z-index: 30;
  padding: 4px; border-radius: 9px; cursor: default;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.18);
}
.menu button {
  width: 100%; display: flex; align-items: center; gap: 10px;
  height: 28px; padding: 0 8px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left;
}
.menu button:hover { background: var(--hl); }
.menu button .k { margin-left: auto; color: var(--faint); font-size: 11px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

/* ---- side panel ---- */
.side {
  position: absolute; top: calc(var(--title-h) + var(--tool-h)); left: 0; bottom: var(--status-h); width: var(--side-w); z-index: 9;
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
}
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; background: var(--tabstrip); border-bottom: 1px solid var(--line); }
.tab {
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px; margin-bottom: -1px;
  border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0;
  background: none; color: var(--muted); cursor: pointer;
}
.tab:hover { background: var(--hl); color: var(--text); }
.tab.on, .tab.peek { background: var(--panel); border-color: var(--line); color: var(--text); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }

.vp {

.opp {

.fld.top > label { padding-top: 5px; }

.ferr { margin: -2px 0 5px 68px; color: var(--danger); font-size: 11.5px; }
.pf {

.modal-bg { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.25); display: grid; place-items: center; }
.modal {

  .wel-inner { padding: 32px 16px; }
  .recent { grid-template-columns: repeat(2, 1fr); }
}

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

// Camera orbiting target T. yaw around +Z, pitch above the XY plane. Orthographic,
// or in perspective with the eye D from T: the target's depth keeps its scale,
// nearer is larger.
function makeProj(yaw, pitch, T, D = Infinity) {
  const cy = Math.cos(rad(yaw)), sy = Math.sin(rad(yaw)), cp = Math.cos(rad(pitch)), sp = Math.sin(rad(pitch));
  const d = [cp * cy, cp * sy, sp], r = [-sy, cy, 0], u = [-sp * cy, -sp * sy, cp];
  const light = norm([0, 1, 2].map(i => -0.45 * r[i] + 0.7 * u[i] + 0.6 * d[i]));
  const P = (x, y, z) => {
    const q = [x - T[0], y - T[1], z - T[2]], k = D === Infinity ? 1 : D / Math.max(D - dot(q, d), 1e-3);
    return [dot(q, r) * k, -dot(q, u) * k];

  // Whether a face with normal n through point p is turned towards the eye.
  const facing = (n, p, eps = 1e-4) => D === Infinity ? dot(n, d) > eps : dot(n, sub(add(T, mul(d, D)), p)) > eps;
  return { P, d, r, u, T, D, light, facing, depth: p => dot(sub(p, T), d) };
}

function shade(n, pr, dark) {

// Faces are planar polygons with outward normals; back faces are culled and
// the rest painted far-to-near. Holes are drawn on their face: the near rim is
// the wall, the far rim clipped to it is where you see through. A face can
// carry its body (`body`), a colour variant (`tint`), `draft` (a preview,
// never picked), `fade` and a shell's `opening`.
function solidSvg(faces, pr, interactive) {
  const vis = faces.filter(f => pr.facing(f.n, f.p[0]))
    .map(f => ({ f, z: depthOf(f.p, pr) }))
    .sort((a, b) => a.z - b.z);
  const bodySel = interactive && st.sel?.kind === 'body';
  const dark = isDark();
  let out = '';
  for (const { f } of vis) {
    const c = shade(f.n, pr, dark), p = pts(f.p, pr), fill = c[f.tint || 'f'];
    const live = interactive && !f.draft, body = f.body || 'body';
    const inBody = live && ((bodySel && st.sel.id === body) || opMarks.has('body:' + body));
    if (live) {
      const sel = inBody || (f.id && (st.sel?.id === f.id || opMarks.has(f.id)));
      const cls = 'face' + (sel ? ' sel' : '') + (f.fade ? ' fade' : '') + (f.smooth ? ' smooth' : '');
      out += `<polygon class="${cls}"${f.id ? ` data-face="${f.id}"` : ''} data-body="${body}" style="--f:${fill};--fs:${c.s};--fh:${c.h}" points="${p}"/>`;
    } else {
      out += `<polygon class="tf${f.draft ? ' draft' : ''}" style="fill:${fill}${f.smooth ? ';stroke:' + fill : ''}" points="${p}"/>`;
    }
    if (f.opening) out += `<polygon class="wall" points="${pts(f.opening, pr)}"/>`;
    for (const [a, b] of f.tangents || []) out += lineP(a, b, 'tangent', pr);
    for (const h of f.holes || []) {
      const id = 'c' + (uid++);
      const sel = inBody || st.sel?.id === h.id;
      const attrs = live && h.id ? ` class="hole${sel ? ' sel' : ''}" data-face="${h.id}" data-body="${body}"` : '';

      out += `<g${attrs}><clipPath id="${id}"><polygon points="${near}"/></clipPath>
        <polygon class="wall" points="${near}"/>
        <polygon class="thru" clip-path="url(#${id})" points="${pts(h.far, pr)}"/></g>`;
    }
  }
  return out;
}

// The tool rail: the same sets as the Alt bar, one card each with the set's
// icon, its number key and its first tools on a recessed strip. Pointing at a
// set (or clicking it, or its number key) opens its full list beside the card;
// letters then pick from it, Esc closes it.
const SET_STYLE = {
  model: { Create: ['cat-create', 'solid'], Modify: ['cat-modify', 'mod'], Transform: ['cat-transform', 'solid'], Construct: ['cat-construct', 'cons'], Inspect: ['cat-inspect', 'insp'] },
  sketch: { Create: ['cat-draw', 'sketch'], Modify: ['cat-smodify', 'mod'], Constraints: ['cat-constrain', 'cstr'], Dimension: ['cat-dim', 'dim'] },
};
const RAIL_TOOLS = 3;
const railSets = () => st.mode === 'sketch' ? SKETCH_GROUPS : MODEL_GROUPS;
const railStyle = name => SET_STYLE[st.mode === 'sketch' ? 'sketch' : 'model'][name];
// The keys opening the rail's sets, in order: the top row from the left.
// No tool's key is one of them.
const RAIL_SET_KEYS = 'QWERTYUIO';
// Shortcut letters inside an open set: the first free letter of each label,
// never a set's key, so another set opens from an open list.
function railLetters(items) {
  const used = [...RAIL_SET_KEYS.slice(0, railSets().length)];
  return items.map(o => { const k = [...o.label.toUpperCase()].find(c => /[A-Z]/.test(c) && !used.includes(c)) || ''; used.push(k); return k; });
}
// A rail tool's shortcut: the toolbar's key for it in model mode, the sketch tool's key in a sketch.
const toolKey = o => o.op.startsWith('tool:') ? TOOLS[o.op.slice(5)]?.key || '' : ops().find(x => x.id === o.op)?.key || '';
function rail() {
  return `<div class="rail">${railSets().map(([name, items], i) => {
    const [ic, cat] = railStyle(name);
    const tools = items.slice(0, RAIL_TOOLS).map(o => `<button class="rtool" data-act="rgop:${o.op}" data-tip="${o.label}" data-key="${toolKey(o)}">${icon(o.icon)}</button>`).join('');
    return `<div class="rcard"><button class="rset${st.railOpen === i ? ' on' : ''}" data-act="rail:${i}" data-rail="${i}" title="${name} (${RAIL_SET_KEYS[i]})">${icon(ic, 'i c-' + cat)}</button>${tools ? `<div class="rtools">${tools}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
function railPop() {
  const set = railSets()[st.railOpen];
  if (!set) return '';
  const [name, items] = set, [ic, cat] = railStyle(name), keys = railLetters(items);
  return `<div class="rpop" id="rpop" style="--rc:var(--i-${cat})">
    <div class="hd">${icon(ic, 'i c-' + cat)}${name}<kbd class="own">${RAIL_SET_KEYS[st.railOpen]}</kbd><kbd>Esc</kbd></div>
    ${items.map((o, i) => `<button data-act="rgop:${o.op}">${icon(o.icon)}${o.label}<span class="k">${keys[i]}</span></button>`).join('')}
  </div>`;
}
// After a render: line the open list up with its card, moved up as far as it
// must to stay in the window, and drop rail tools evenly if the rail is short
// (the set showing the most gives up its last one until everything fits).
function placeRail() {
  const r = $('.rail');
  if (!r) return;
  const strips = [...r.querySelectorAll('.rtools')].map(t => [...t.children]);
  strips.flat().forEach(b => b.hidden = false);
  r.querySelectorAll('.rtools').forEach(t => t.hidden = false);
  for (let guard = 100; r.scrollHeight > r.clientHeight + 1 && guard--;) {
    let most = null;
    for (const s of strips) { const v = s.filter(b => !b.hidden); if (v.length && (!most || v.length >= most.length)) most = v; }
    if (!most) break;
    most.at(-1).hidden = true;
    const t = most.at(-1).parentElement;
    if (![...t.children].some(b => !b.hidden)) t.hidden = true;
  }
  const pop = $('#rpop'), card = st.railOpen != null && $(`[data-rail="${st.railOpen}"]`);
  if (!pop || !card) return;
  const win = $('#win').getBoundingClientRect(), top = card.getBoundingClientRect().top - win.top - 4;
  const bottom = win.height - parseFloat(getComputedStyle(root).getPropertyValue('--status-h')) - 8;
  pop.style.top = Math.max(0, Math.min(top, bottom - pop.offsetHeight)) + 'px';
}

// Run an operation from the Alt bar. Sketch tools need a sketch first.
function globalOp(op) {
  if (op.startsWith('tool:') && st.mode !== 'sketch') { st.pick = true; st.sel = null; toast('Pick a plane to sketch on first'); return; }
  if (op === 'sketch' && st.mode === 'sketch') { toast('Already in a sketch'); return; }
  if (st.op && !OPS[op]) st.op = null;
  doOp(op);
}

const Tool = (label, key, hint) => ({ label, key, hint });
const TOOLS = {

  circle: Tool('Circle', 'C', 'Click center point'), arc: Tool('Arc', 'A', 'Click start point'),

  dim: Tool('Dimension', 'D', 'Select geometry to dimension'), constrain: Tool('Constrain', 'K', 'Select entities to constrain'),
  polygon: Tool('Polygon', '', 'Click center point'), spline: Tool('Spline', '', 'Click first fit point'),
  extend: Tool('Extend', '', 'Click a segment to extend'), mirror: Tool('Mirror', '', 'Select entities to mirror'),
};

function hints() {
  const k = s => s.split(' ').map(x => x.startsWith('mouse:') ? mouse(x.slice(6)) : `<kbd>${x}</kbd>`).join('');
  // Without mouse hints, only those for keys.
  const h = list => list.filter(([keys]) => st.mouseHints || !keys.includes('mouse:'))
    .map(([keys, label]) => `<span class="h">${k(keys)}<span>${label}</span></span>`).join('');
  if (st.screen === 'welcome') return h([['N', 'New design'], ['O', 'Open'], ['?', 'Shortcuts']]);
  const nav = [['mouse:l', 'Drag to orbit'], ['mouse:r', 'Pan'], ['mouse:w', 'Zoom'], ['mouse:m', 'Click to set pivot']];
  switch (context()) {
    case 'none': return h([['mouse:l', 'Select'], ['mouse:l mouse:l', 'Body'], ...nav]);
    case 'pick': return h([['mouse:l', 'Pick plane'], ...nav, ['Esc', 'Cancel']]);
    case 'face': case 'plane': return h([['S', 'Sketch'], ['U', 'Press pull'], ['mouse:l mouse:l', 'Body']]);
    case 'hole': return h([['F', 'Fillet'], ['Enter', 'Edit hole'], ['mouse:l mouse:l', 'Body']]);
    case 'feature': return h([['Enter', 'Edit'], ['Del', 'Delete'], ['mouse:l', 'Drag to reorder']]);
    case 'body': return h([['M', 'Move'], ['P', 'Pattern'], ['V', 'Hide']]);
    case 'op': {
      const p = OPS[st.op.kind].picks[st.op.pick];
      return h([['mouse:l', p ? 'Pick ' + p.what : 'Pick'], ...nav, ['Enter', 'OK'], ['Esc', 'Cancel']]);
    }
    case 'sketch': return h([['L', 'Line'], ['B', 'Rect'], ['C', 'Circle'], ['D', 'Dimension'], ['Esc', 'Finish']]);
    case 'tool': return h([['mouse:l', TOOLS[st.tool].hint], ['Shift', 'No snap'], ['Tab', 'Type value'], ['Esc', 'Stop tool']]);
  }
  return '';
}

function info() {
  if (st.screen === 'welcome') return '';
  const c = context();
  if (c === 'pick') return `<span class="accent">Select a plane or planar face for the new sketch</span>`;
  if (c === 'op') {
    const o = st.op, def = OPS[o.kind], r = def.check(o, opCtx()), p = def.picks[o.pick];
    const bad = r.error || Object.values(r.errs)[0];
    const msg = bad || r.need || (ready(r) ? 'Ready: Enter or OK adds it' : '') + (p ? ` · ${p.hint}` : '');
    return `${icon(def.icon)}<b>${o.editing ? o.name : def.label}</b><span class="${bad ? 'bad' : 'muted'}">${msg}</span>`;
  }
  if (c === 'sketch' || c === 'tool') {
    const s = SKETCHES[st.sketch.id];
    const name = st.doc.timeline.find(t => t.id === st.sketch.id).name;
    return s
      ? `<span class="dotok"></span><b>${name}</b><span class="muted">Fully constrained · ${s.summary}</span>`
      : `<b>${name}</b><span class="muted">Empty · on ${FACE_INFO[st.sketch.plane]?.[1] || 'face'}</span>`;
  }
  if (c === 'none') return '';
  if (c === 'face' || c === 'hole' || c === 'plane') {
    const [t, d, f] = FACE_INFO[st.sel.id];
    return `${icon(c === 'plane' ? 'plane' : 'body')}<b>${t}</b><span>${d}</span><span class="muted">${f}</span>`;
  }
  if (c === 'body') {
    if (st.sel.id === 'body') return `${icon('body')}<b>Bracket</b><span>84.3 cm³</span><span class="muted">228 g · Aluminium 6061</span>`;
    const b = bodiesAt(activeFeatures()).find(b => b.id === st.sel.id);
    const by = st.doc.timeline.find(t => t.id === st.sel.id.split(':')[0]);
    return `${icon('body')}<b>${b?.name || 'Body'}</b><span class="muted">made by ${by?.name || 'a feature'}</span>`;
  }
  if (c === 'feature') {
    const f = st.doc.timeline.find(t => t.id === st.sel.id);

    return `${icon(f.type)}<b>${f.name}</b><span class="muted">${extra}</span>`;
  }
  return '';
}

const PROJECTIONS = [[false, 'ortho', 'Orthographic'], [true, 'persp', 'Perspective']];
const projDropdown = () => {
  return `<div class="projdd${st.projMenu ? ' open' : ''}">
    <button class="sb-btn" data-act="projmenu" title="View options">${icon('more')}</button>
    ${st.projMenu ? `<div class="menu">${PROJECTIONS.map(([p, ic, label]) =>
      `<button class="${st.persp === p ? 'on' : ''}" data-act="proj:${ic}">${icon(ic)}${label}${icon('check', 'i tick')}</button>`).join('')}
      <hr><button class="${st.mouseHints ? 'on' : ''}" data-act="mousehints"><span class="mi">${mouse('l')}</span>Mouse hints${icon('check', 'i tick')}</button></div>` : ''}
  </div>`;
};

// ---------------------------------------------------------------- side panel
function side() {
  const shown = st.alt ? (st.panel === 'timeline' ? 'objects' : 'timeline') : st.panel;
  const tab = (id, label, ic) => `
    <button class="tab${shown === id ? (st.alt ? ' peek' : ' on') : ''}" data-act="tab:${id}">
      ${icon(ic)}${label}${id !== st.panel && !st.alt ? '<kbd>Alt</kbd>' : ''}
    </button>`;
  return `
    <div class="tabs">${tab('timeline', 'Timeline', 'rollback')}${tab('objects', 'Objects', 'body')}</div>
    <div class="list">${shown === 'timeline' ? timeline() : objects()}</div>`;
}

// The timeline is rendered as one sequence with the rollback marker in it,
// so rows and marker can be dragged to any position the same way.
function timeline() {
  const d = st.doc, tl = d.timeline;
  if (!tl.length) return `<div class="empty-note">No features yet.<br>Pick an origin plane and press <kbd>S</kbd> to start a sketch.</div>`;
  // Editing a sketch or a solid operation rolls the model back to it.
  const editing = st.mode === 'sketch', opEdit = st.op?.editing;
  const cut = editing ? tl.findIndex(t => t.id === st.sketch.id) + 1
    : opEdit ? tl.findIndex(t => t.id === opEdit) + 1 : d.rollback;
  const seq = [...tl.slice(0, cut), { marker: true }, ...tl.slice(cut)];
  const drag = editing || opEdit ? '' : ' draggable="true"';
  return seq.map((t, i) => {
    if (t.marker) return `<div class="marker tl-item" data-idx="${i}" data-drag="marker"${drag} title="Drag to roll back">${editing || opEdit ? 'Rolled back' : ''}</div>`;
    const cls = ['row', 'tl-item'];
    if ((editing && t.id === st.sketch.id) || st.op?.editing === t.id) cls.push('editing');
    else if (i > cut) cls.push('rolled');
    if (st.sel?.kind === 'feature' && st.sel.id === t.id) cls.push('sel');
    return `<div class="${cls.join(' ')}" data-idx="${i}" data-drag="row" data-id="${t.id}"${drag} data-act="tl:${t.id}">
      <span class="ic">${icon(t.type)}</span><span class="name">${t.name}</span><span class="meta">${t.meta || ''}</span></div>`;
  }).join('');
}

function objects() {
  const d = st.doc, hid = d.hidden;
  const row = (id, name, ic, depth, { group, sel, eye = true } = {}) => {
    const off = hid.has(id);
    return `<div class="row${group ? ' group' : ''}${sel ? ' sel' : ''}${off ? ' dim' : ''}" data-act="obj:${id}" style="padding-left:${8 + depth * 16}px">
      <span class="ic">${icon(group ? 'chev' : ic)}</span><span class="name">${name}</span>
      ${eye ? `<button class="eye${off ? ' off' : ''}" data-act="eye:${id}" title="${off ? 'Show' : 'Hide'}">${icon(off ? 'eyeoff' : 'eye')}</button>` : ''}
    </div>`;
  };
  const sketches = d.timeline.filter(t => t.type === 'sketch');
  let out = row('origin', 'Origin', 'origin', 0, { group: true });
  if (!hid.has('origin')) {
    for (const p of ['xy', 'xz', 'yz']) out += row('plane-' + p, p.toUpperCase() + ' plane', 'plane', 1, { sel: st.sel?.id === 'plane-' + p, eye: false });
  }
  const bodies = bodiesAt(activeFeatures());
  out += row('bodies', `Bodies <span class="meta">${bodies.length}</span>`, '', 0, { group: true, eye: false });
  for (const b of bodies) out += row(b.id, b.name, 'body', 1, { sel: st.sel?.kind === 'body' && st.sel.id === b.id });
  out += row('sketches', `Sketches <span class="meta">${sketches.length}</span>`, '', 0, { group: true, eye: false });
  for (const s of sketches) out += row(s.id, s.name, 'sketch', 1, { sel: st.sel?.id === s.id });
  return out;
}

// ---------------------------------------------------------------- viewport
// The grid's plane: the XY plane, or the sketch's being edited, as an origin
// and unit x and y axes.
function gridPlane() {
  if (st.mode !== 'sketch') return { o: [0, 0, 0], x: [1, 0, 0], y: [0, 1, 0] };
  const f = PLANES[st.sketch.plane].f, o = f(0, 0);
  return { o, x: norm(sub(f(1, 0), o)), y: norm(sub(f(0, 1), o)) };
}

// The app's grid (`fs_grid` in crates/render/src/shaders/scene.wgsl), ported
// per pixel onto a canvas under the scene: unbounded on its plane, its spacing
// a power of ten keeping the finest lines at least 16 px apart where each
// pixel looks, each level fading into the next as it gets denser, faded out
// from 1.5 to 6 view heights of the target and at grazing angles.
const GRID_COLOR = '#737d8a';
function drawGrid() {
  const svg = $('#scene'), cv = $('#grid');
  if (!svg || !cv) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  if (cv.width !== W || cv.height !== H) Object.assign(cv, { width: W, height: H });
  // Canvas pixel to scene units: the scene's viewBox, fitted as "meet".
  const vb = svg.viewBox.baseVal, k = Math.max(vb.width / W, vb.height / H);
  const x0 = vb.x + vb.width / 2 - W * k / 2, y0 = vb.y + vb.height / 2 - H * k / 2;
  const g = gridPlane(), n = cross(g.x, g.y), { T, d, r, u, D } = proj, persp = D !== Infinity;
  const to = sub(T, g.o), D_ = persp ? D : 0;
  // Linear forms in the screen point (sx, sy) of the point q on the view
  // plane at the target, and of the ray's direction, along n, x and y.
  const lin = v => [dot(to, v), dot(r, v), -dot(u, v), dot(d, v)];
  const [N, X, Y] = [lin(n), lin(g.x), lin(g.y)];
  // Plane coordinates of the pixel's ray, with how squarely it meets the
  // plane, or null if it doesn't ahead of the eye.
  const px = new Float32Array((W + 1) * (H + 1)), py = new Float32Array(px.length), ok = new Uint8Array(px.length);
  const cosA = new Float32Array(px.length);
  for (let j = 0; j <= H; j++) {
    const sy = y0 + (j + 0.5) * k;
    for (let i = 0; i <= W; i++) {
      const sx = x0 + (i + 0.5) * k, at = j * (W + 1) + i;
      const qn = N[0] + N[1] * sx + N[2] * sy, qx = X[0] + X[1] * sx + X[2] * sy, qy = Y[0] + Y[1] * sx + Y[2] * sy;
      const dn = persp ? -D_ * N[3] + N[1] * sx + N[2] * sy : -N[3];
      const dx = persp ? -D_ * X[3] + X[1] * sx + X[2] * sy : -X[3];
      const dy = persp ? -D_ * Y[3] + Y[1] * sx + Y[2] * sy : -Y[3];
      if (Math.abs(dn) < 1e-12) continue;
      const t = -qn / dn;
      if (persp && t <= -1) continue;
      px[at] = qx + t * dx; py[at] = qy + t * dy; ok[at] = 1;
      cosA[at] = Math.abs(dn) / (persp ? Math.hypot(D_, sx, sy) : 1);
    }
  }
  const fc = add(T, sub(mul(r, cam.px), mul(u, cam.py))), fx = dot(sub(fc, g.o), g.x), fy = dot(sub(fc, g.o), g.y);
  const extent = H * k;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const weight = x => clamp((x + 1) * 0.25, 0, 0.6);
  const lines = (cx, cy, wx, wy, s) => {
    const lx = Math.abs(((cx / s - 0.5) % 1 + 1) % 1 - 0.5) / Math.max(wx / s, 1e-6);
    const ly = Math.abs(((cy / s - 0.5) % 1 + 1) % 1 - 0.5) / Math.max(wy / s, 1e-6);
    return 1 - Math.min(lx, ly, 1);
  };
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), out = img.data;
  const [cr, cg, cb] = [1, 3, 5].map(i => parseInt(GRID_COLOR.slice(i, i + 2), 16));
  for (let j = 0; j < H; j++) {
    for (let i = 0; i < W; i++) {
      const at = j * (W + 1) + i, ar = at + 1, dn = at + W + 1;
      if (!ok[at] || !ok[ar] || !ok[dn]) continue;
      const cx = px[at], cy = py[at];
      // fwidth: the change over a pixel across and down.
      const wx = Math.abs(px[ar] - cx) + Math.abs(px[dn] - cx), wy = Math.abs(py[ar] - cy) + Math.abs(py[dn] - cy);
      const level = Math.log10(Math.max(Math.hypot(wx, wy), 1e-6) * 16), s = 10 ** Math.floor(level), f = level - Math.floor(level);
      const l = Math.max(lines(cx, cy, wx, wy, s) * weight(-f), lines(cx, cy, wx, wy, s * 10) * weight(1 - f), lines(cx, cy, wx, wy, s * 100) * weight(2 - f));
      const fade = (1 - smooth(extent * 1.5, extent * 6, Math.hypot(cx - fx, cy - fy))) * smooth(0.02, 0.15, cosA[at]);
      const a = l * fade;
      if (a <= 0) continue;
      const o = (j * W + i) * 4;
      out[o] = cr; out[o + 1] = cg; out[o + 2] = cb; out[o + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
}

function originSvg() {
  const planes = [
    { id: 'plane-yz', p: [[0, 0, 0], [0, 40, 0], [0, 40, 40], [0, 0, 40]], lab: 'YZ', lp: [0, 34, 36] },
    { id: 'plane-xz', p: [[0, 0, 0], [40, 0, 0], [40, 0, 40], [0, 0, 40]], lab: 'XZ', lp: [34, 0, 36] },
    { id: 'plane-xy', p: [[0, 0, 0], [40, 0, 0], [40, 40, 0], [0, 40, 0]], lab: 'XY', lp: [34, 34, 0] },
  ].map(p => ({ ...p, z: depthOf(p.p) })).sort((a, b) => a.z - b.z);
  let out = '';
  for (const p of planes) {
    const [lx, ly] = proj.P(...p.lp);
    out += `<polygon class="oplane${st.sel?.id === p.id ? ' sel' : ''}" data-face="${p.id}" points="${pts(p.p)}"/><text class="oplane-label" x="${lx}" y="${ly}">${p.lab}</text>`;
  }
  return out;
}

// The X, Y and Z axes' colours, the app's (`AXES` in crates/view/src/theme.rs).
const AXIS_COLORS = ['#c24740', '#59a14f', '#4073c4'];

// The grid's x and y axis lines, as the app's: through its origin, on to
// the horizon, not faded, over the grid but under the model, each in the
// colour of the world axis it lies along, or the grid's.
function gridAxesSvg(g) {
  let out = '';
  for (const a of [g.x, g.y]) {
    // Each way from the origin, short of the eye in perspective.
    const reach = s => {
      const dd = s * dot(a, proj.d), d0 = proj.depth(g.o);
      return proj.D === Infinity || dd <= 0 ? 1e5 : Math.min(1e5, (0.98 * proj.D - d0) / dd);
    };
    const world = [0, 1, 2].find(i => Math.abs(a[i]) > 1 - 1e-6);
    const line = lineP(add(g.o, mul(a, -reach(-1))), add(g.o, mul(a, reach(1))), 'axis');
    out += line.replace('class="axis"', `class="axis" stroke="${world === undefined ? GRID_COLOR : AXIS_COLORS[world]}"`);
  }
  return `<g style="pointer-events:none">${out}</g>`;
}

// Scene units per screen pixel, for things sized in pixels.
function unitsPerPixel() {
  const s = $('#scene'), w = 380 * cam.zoom, h = 250 * cam.zoom;
  const r = s?.getBoundingClientRect();
  return r?.width && r.height ? Math.max(w / r.width, h / r.height) : h / 600;
}

// The app's origin marker: a ring lying in the XY plane, its widest 10 px
// on screen at any zoom, and a dot at the origin, each white with a dark rim.
function originMarkerSvg() {
  const k = unitsPerPixel(), h = 1e-3, [ox, oy] = proj.P(0, 0, 0);
  const img = v => { const [x, y] = proj.P(...mul(v, h)); return [(x - ox) / h, (y - oy) / h]; };
  const ex = img([1, 0, 0]), ey = img([0, 1, 0]);
  const at = t => [Math.cos(t) * ex[0] + Math.sin(t) * ey[0], Math.cos(t) * ex[1] + Math.sin(t) * ey[1]];
  const ts = Array.from({ length: 48 }, (_, i) => i * Math.PI / 24);
  const widest = Math.max(...ts.map(t => Math.hypot(...at(t))), 1e-9), sc = 10 * k / widest;
  const ring = ts.map(t => at(t).map((c, j) => ((j ? oy : ox) + c * sc).toFixed(3)).join(',')).join(' ');
  return `<g style="pointer-events:none">
    <polygon class="origin-ring rim" points="${ring}"/><polygon class="origin-ring core" points="${ring}"/>
    <circle cx="${ox}" cy="${oy}" r="${3.5 * k}" fill="#333840"/><circle cx="${ox}" cy="${oy}" r="${2.5 * k}" fill="#fff"/>
  </g>`;
}

// The point the camera orbits, picked with a middle click on the model (or
// in a sketch, its plane): { p, at }, `at` when its marker last showed whole
// with the pointer off the view cube. As the app's: a ring facing the screen,
// its radius 10 px, and a dot, each in the accent with a dark rim; shown for
// 2 s once picked, then faded over 0.4 s, and while the pointer is over the
// view cube; not where it shows on the origin, whose marker is there. Picking
// it pans it to the middle of the view. Home forgets it, and so does a middle
// click off the model and the grid.
let pivot = null, cubeHover = false, pivotAnim = 0;
const PIVOT_SHOWN = 2000, PIVOT_FADE = 400;
// Faces drawn in the scene last, for picking the pivot.
let sceneFaces = [];
function pivotOpacity(now = performance.now()) {
  if (!pivot) return 0;
  if (cubeHover) return 1;
  return clamp(1 - (now - pivot.at - PIVOT_SHOWN) / PIVOT_FADE, 0, 1);
}
function pivotMarkerSvg() {
  if (!pivot) return '';
  const k = unitsPerPixel(), [x, y] = proj.P(...pivot.p), [ox, oy] = proj.P(0, 0, 0);
  if (Math.hypot(x - ox, y - oy) < 1.5 * k) return '';
  return `<g id="pivot-mark" style="pointer-events:none" opacity="${pivotOpacity()}">
    <circle class="origin-ring rim" cx="${x}" cy="${y}" r="${10 * k}"/><circle class="origin-ring core pivot-ring" cx="${x}" cy="${y}" r="${10 * k}"/>
    <circle cx="${x}" cy="${y}" r="${3.5 * k}" fill="#333840"/><circle cx="${x}" cy="${y}" r="${2.5 * k}" fill="var(--accent)"/>
  </g>`;
}
// Fades the marker frame by frame, until it's gone or the pointer is over the cube.
function fadePivot() {
  cancelAnimationFrame(pivotAnim);
  const step = () => {
    const o = pivotOpacity();
    $('#pivot-mark')?.setAttribute('opacity', o);
    if (o > 0 && !cubeHover) pivotAnim = requestAnimationFrame(step);
  };
  step();
}
// Picking a pivot pans to bring it to the middle of the view.
function setPivot(p) {
  pivot = p && { p, at: performance.now() };
  redrawScene();
  fadePivot();
  if (p) {
    const [px, py] = proj.P(...p);
    animateCam({ px, py });
  }
}
// Where the ray through the client position (cx, cy) first meets a face of
// the model drawn, or else the grid's plane (XY, or the sketch's) where the
// grid shows, within 6 view heights of the view's middle; or null.
function pointAt(cx, cy) {
  const s = $('#scene'), sp = s.createSVGPoint();
  sp.x = cx; sp.y = cy;
  const q = sp.matrixTransform(s.getScreenCTM().inverse());
  const { r, u, d, T, D } = proj;
  // At the target's depth, which keeps its scale either way.
  const base = add(T, add(mul(r, q.x), mul(u, -q.y)));
  const [o, dir] = D === Infinity ? [base, mul(d, -1)] : [add(T, mul(d, D)), sub(base, add(T, mul(d, D)))];
  const meet = (n, p0) => {
    const along = dot(n, dir);
    if (Math.abs(along) < 1e-9) return null;
    const t = dot(n, sub(p0, o)) / along;
    return D !== Infinity && t <= 0 ? null : add(o, mul(dir, t));
  };
  const inside = ps => {
    let c = false;
    for (let i = 0, j = ps.length - 1; i < ps.length; j = i++) {
      const [xi, yi] = ps[i], [xj, yj] = ps[j];
      if ((yi > q.y) !== (yj > q.y) && q.x < (xj - xi) * (q.y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  let best = null;
  for (const f of sceneFaces) {
    if (f.draft || !proj.facing(f.n, f.p[0]) || !inside(f.p.map(p => proj.P(...p)))) continue;
    const hit = meet(f.n, f.p[0]);
    if (hit && (!best || proj.depth(hit) > proj.depth(best))) best = hit;
  }
  if (best) return best;
  const g = gridPlane(), hit = meet(cross(g.x, g.y), g.o);
  if (!hit) return null;
  const mid = add(T, sub(mul(r, cam.px), mul(u, cam.py))), off = sub(hit, mid);
  const height = $('#scene').getBoundingClientRect().height * unitsPerPixel();
  return Math.hypot(dot(off, g.x), dot(off, g.y)) <= 6 * height ? hit : null;
}

function sketchGeomSvg(id, planeKey, withDims) {
  const s = SKETCHES[id];
  if (!s) return '';
  const f = PLANES[planeKey].f, at = uv => proj.P(...f(...uv));
  const extra = withDims ? '' : ' sk-visible';
  let out = '';
  const pt = p => { const [x, y] = proj.P(...p); return `<circle class="sk-pt" cx="${x}" cy="${y}" r="1"/>`; };
  if (s.closed) {
    const ps = s.closed.map(([u, v]) => f(u, v));
    out += `<polygon class="sk${extra}" points="${pts(ps)}"/>`;
    if (withDims) out += ps.map(pt).join('');
  }
  for (const c of s.circles || []) {
    out += `<polygon class="sk${extra}" points="${pts(circ(f, c.c[0], c.c[1], c.r))}"/>`;
    if (withDims) out += pt(f(...c.c));
  }
  if (withDims) {
    for (const d of s.dims || []) {
      const a = at(d.a), b = at(d.b);
      out += `<line class="sk-dim" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
      out += `<circle class="sk-dim-end" cx="${a[0]}" cy="${a[1]}" r=".7"/><circle class="sk-dim-end" cx="${b[0]}" cy="${b[1]}" r=".7"/>`;
      out += `<text class="sk-label" x="${(a[0] + b[0]) / 2}" y="${(a[1] + b[1]) / 2}">${d.t}</text>`;
    }
    for (const l of s.labels || []) { const [x, y] = at(l.p); out += `<text class="sk-label" x="${x}" y="${y}">${l.t}</text>`; }
  }
  return out;
}

const viewBox = () => { const w = 380 * cam.zoom, h = 250 * cam.zoom; return `${cam.px - w / 2} ${cam.py - h / 2} ${w} ${h}`; };

function sceneInner() {
  const d = st.doc;
  proj = makeProj(cam.yaw, cam.pitch, d.T, st.persp ? eyeDistance() : Infinity);
  const inSketch = st.mode === 'sketch';
  const active = activeFeatures();
  const plane = gridPlane();
  const bodies = bodiesAt(active);
  // An operation being set up adds its preview, highlights and pick targets.
  const pv = st.op ? opPreview(ctxOf(bodies, active)) : null;
  opMarks = pv?.marks || new Set();

  let model = '';
  if ((!d.hidden.has('origin') || pv?.planes) && !(inSketch && d.kind === 'bracket')) model += originSvg();
  const faces = bodies.filter(b => !d.hidden.has(b.id))
    .flatMap(b => b.faces.map(f => ({ ...f, body: b.id, fade: pv?.fade?.has(b.id), tint: pv?.tint?.get(b.id) })));
  faces.push(...(pv?.faces || []));
  sceneFaces = faces;
  if (faces.length) model += solidSvg(faces, proj, true);

  let overlay = '';
  if (inSketch) {
    overlay += sketchGeomSvg(st.sketch.id, st.sketch.plane, true);
  } else if (d.kind === 'bracket') {
    // Sketches show when made visible, or when nothing has consumed them yet.
    for (const id of Object.keys(SKETCHES)) {
      const unconsumed = id === 's1' && !active.has('e1');
      if (active.has(id) && (!d.hidden.has(id) || unconsumed)) overlay += sketchGeomSvg(id, SKETCHES[id].plane, false);
    }
  }
  const marker = !d.hidden.has('origin') && !(inSketch && d.kind === 'bracket') ? originMarkerSvg() : '';
  // The marker is over the model and the finished sketches, under the sketch being edited.
  overlay = inSketch ? marker + pivotMarkerSvg() + overlay : overlay + marker + pivotMarkerSvg();
  return `${gridAxesSvg(plane)}<g class="${inSketch ? 'ghost' : ''}">${model}</g><g style="pointer-events:none">${overlay}</g><g class="opl">${pv?.svg || ''}</g>`;
}

// The view cube, as the app's (crates/view/src/view_cube.rs): 116 px, room
// around the cube for the X, Y and Z axes, each along an edge of the cube in
// sight and on past it to an arrowhead and its letter.
const CUBE = 116, CUBE_HALF = 25;
function cubeInner() {
  const pr = makeProj(cam.yaw, cam.pitch, [0, 0, 0]);
  const s = CUBE_HALF, m = CUBE / 2, dark = isDark();
  const L = v => [dot(v, pr.r), -dot(v, pr.u)];
  const W = v => L(v).map(x => x + m);
  const faces = [
    { n: [0, 0, 1], k: 'T', name: 'Top', u: [1, 0, 0], v: [0, -1, 0], view: 'top' },
    { n: [0, 0, -1], k: 'U', name: 'Under', u: [1, 0, 0], v: [0, 1, 0], view: 'bottom' },
    { n: [0, -1, 0], k: 'F', name: 'Front', u: [1, 0, 0], v: [0, 0, -1], view: 'front' },
    { n: [0, 1, 0], k: 'B', name: 'Back', u: [-1, 0, 0], v: [0, 0, -1], view: 'back' },
    { n: [1, 0, 0], k: 'R', name: 'Right', u: [0, 1, 0], v: [0, 0, -1], view: 'right' },
    { n: [-1, 0, 0], k: 'L', name: 'Left', u: [0, -1, 0], v: [0, 0, -1], view: 'left' },
