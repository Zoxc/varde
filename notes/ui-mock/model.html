<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varde UI Mock: Model</title>
<!--
  The varde UI mock's model screen, a design open in the model space, seen
  from a fixed camera. Open directly in a browser; the links over the window
  switch to the welcome and the sketch pages.

  Fillet 2 in the timeline has failed: select it to see where, double-click
  it to open it (R5 or less fixes it).
  Try: click faces, double-click to select the body, hold Alt (swaps
  timeline/objects), S to sketch (the sketch page), Esc to back out, ? for
  shortcuts.
  Solid operations (Extrude X, Revolve O, Chamfer C, Combine B, Move M, Pattern P, and
  Shell, Mirror, Circular pattern from the Alt bar or with a body selected)
  open a panel at the viewport's right; click its fields, then the model.
  OK adds the operation to the timeline; the model stays as it is.
  The tool rail floats over the view's left edge with a card per tool set
  (the Alt bar's sets): point at a set, click it or press its key (Q, W,
  E, ... from the top) to open its full list beside it, then a letter
  picks a tool; the first tools of each set sit on the card too, with
  instant tooltips. The set's key shows in its open list.

  Deep links: #bracket (any other name opens the bracket under that name),
  #bracket/face, #bracket/body, #bracket/tools, #empty; #bracket/failed
  selects Fillet 2, which fails, and #bracket/failed-edit opens it; #bracket/op:<kind>
  opens an operation set up for a screenshot (extrude, revolve, combine, move,
  bmirror, lpattern, cpattern, fillet, chamfer, shell; /join for revolve's
  join); /v-top (any view cube view) sets the camera.
  Append /still to disable animations, /dark or /light to force the theme,
  /persp for a perspective view, /projmenu to open the status bar's menu,
  /nomouse to hide the mouse hints.
-->
<link rel="stylesheet" href="mock.css">
<style>
/* what a solid operation being set up picks and previews */
.face.fade { opacity: .3; }
.tf.draft { opacity: .88; pointer-events: none; }
.rgn { fill: var(--accent); fill-opacity: .1; stroke: var(--accent); stroke-opacity: .55; stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }
.rgn:hover { fill-opacity: .28; }
.rgn.on { fill-opacity: .38; stroke-opacity: 1; stroke-width: 1.8; }
.opl .hit { stroke: transparent; stroke-width: 11; fill: none; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.opl .vis { fill: none; vector-effect: non-scaling-stroke; pointer-events: none; }
.edc .vis { stroke: var(--hl-line); stroke-width: 3; stroke-opacity: 0; stroke-linecap: round; }
.edc:hover .vis { stroke-opacity: 1; }
.edc.on .vis { stroke: var(--accent); stroke-opacity: 1; }
.axc .vis { stroke: var(--ax); stroke-width: 1.4; stroke-dasharray: 5 3; opacity: .7; }
.axc:hover .vis { stroke-width: 2.6; opacity: 1; }
.axc.on .vis { stroke-width: 2.6; stroke-dasharray: none; opacity: 1; }
.axc text { font: 700 5px system-ui, sans-serif; fill: var(--ax); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.band { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.band.ring { fill: none; }
.pplane { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-opacity: .7; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }

/* ---- operation panel: as the tool rail's cards, a white head over a
   recessed grey well flush along the card's bottom, its top corners rounded
   as the rail's strips are, an accent line over its head. Under the view
   cube; OK and Cancel in the head, labels over their fields, messages at
   the foot. Its controls are the timeline's rows' size: 28 px tall, 12.5 px
   words, 8 px in. */
.opp {
  position: absolute; top: 166px; right: 12px; z-index: 4; width: 288px; max-height: calc(100% - 178px - var(--status-float) - 10px);
  display: flex; flex-direction: column; overflow: hidden;
  border-top: 3px solid var(--accent); border-radius: 8px; background: var(--panel);
  box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(0,0,0,.1);
  --well: color-mix(in srgb, var(--text) 6%, var(--panel));
  --edge: 9px; /* the body's and the foot's margin at the sides */
}
.opp-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 6px 7px 8px; }
.opp-head .hic { display: flex; }
.opp-head b { margin-right: auto; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
.hb:hover { background: var(--hl); color: var(--text); }
.hb.primary { background: var(--accent); border-color: transparent; color: #fff; }
.hb:disabled { opacity: .45; cursor: default; }
.hb svg.i { width: 16px; height: 16px; stroke-width: 2; }
.opp-well { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 6px 6px 0 0; background: var(--well); }
/* The body scrolls, so a long panel never runs off the bottom. */
.opp-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px var(--edge) 10px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.opp-foot { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 2px var(--edge) 8px; }

/* Labels, the fields' and the sections' alike: 11 px, heavy, faint. */
.opp :is(.fld > label, h4) { font-size: 11px; font-weight: 700; color: var(--faint); }
.opp h4 { margin: 10px 0 3px; }
.fld { display: flex; flex-direction: column; gap: 3px; margin: 7px 0; }
.fld input {
  min-width: 0; height: 28px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text);
  font: inherit; font-size: 12.5px; user-select: text;
}
.fld input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fld input.bad, .fld input.bad:focus { border-color: var(--danger); }
.ferr { margin: -3px 0 5px; color: var(--danger); font-size: 11.5px; }

/* A choice among a few. */
.chs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.chs .ch:last-child:nth-child(odd) { grid-column: 1 / -1; }
.ch { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.ch:hover { background: var(--hl); }
.ch.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.ch.on:hover { background: color-mix(in srgb, var(--accent) 24%, var(--panel)); }
/* With icons, the choices are tiles, the icon over a small label; the
   picked one a 1 px accent line on the accent's tint, its words the
   text's. */
.chs.icons { grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); }
.chs.icons .ch:last-child:nth-child(odd) { grid-column: auto; }
.chs.icons .ch { height: auto; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; white-space: normal; line-height: 1.15; }
.chs.icons .ch.on { border-color: var(--accent); color: var(--text); font-weight: 400; }
.ch .chi { display: flex; }
.ch .chi svg.i { width: 22px; height: 22px; }
/* Choices' own icons (.chi), in the tools' colours: profiles and results
   filled lightly; with an accent (.a) the fill is the accent's. */
svg.i .fl { fill: currentColor; fill-opacity: .18; }
svg.i .a.fl { fill: color-mix(in srgb, var(--ca) 60%, var(--cc)); }
svg.i .dot { fill: currentColor; stroke: none; }

/* A field filled by clicks in the view (outlined while it takes them): what's
   picked as rows as the timeline's, each with its icon, the cross to remove
   it after its measure; the place to click for more (.ph) a line across the
   box's foot, under a rule, or alone the box's one row. */
.pf { min-width: 0; min-height: 28px; padding: 3px; display: flex; flex-wrap: wrap; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
.pf.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pf.list { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
.chip { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 12.5px; }
.pf:not(.list) .chip { flex: 1; }
.chip:hover { background: var(--hl); }
.chip .ci { display: flex; color: var(--muted); }
.chip .ci svg.i { width: 16px; height: 16px; }
.chip .nm { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .meta { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.chip .x { flex: none; width: 22px; height: 22px; margin-right: -5px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--faint); cursor: pointer; }
.chip .x:hover { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
.chip .x svg.i { width: 14px; height: 14px; stroke-width: 2.8; }
.pf .ph { display: flex; align-items: center; gap: 8px; height: 24px; margin: 2px -3px -3px; padding: 0 11px; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; color: var(--muted); font-size: 11.5px; }
.pf .ph:only-child { margin-top: -3px; border-top: 0; height: 28px; }
.pf .ph svg.i { width: 13px; height: 13px; flex: none; }
.pf.on .ph { color: var(--accent); }
.pf:hover .ph { background: var(--hl); }

/* Ticks: the bodies' list keeps boxes; an option is an icon toggle (.it), a
   square button with the option's icon beside its name, lit when on, the
   row and the button tinted hovered, on or off; its button on the fields'
   left edge. */
.cb { display: flex; align-items: flex-start; gap: 7px; padding: 6px 0 5px; font-size: 12.5px; cursor: pointer; }
.cb .box { width: 15px; height: 15px; flex: none; display: grid; place-items: center; border: 1px solid var(--faint); border-radius: 4px; color: transparent; }
.cb:hover .box { border-color: var(--accent); }
.cb.on .box { background: var(--accent); border-color: var(--accent); color: #fff; }
.cb .box svg.i { width: 11px; height: 11px; stroke-width: 2.6; }
.cb .tb { display: none; }
.cb.it { align-items: center; gap: 10px; margin: 5px -4px; padding: 3px 4px; border-radius: 7px; }
.cb.it .box { display: none; }
.cb.it .tb { display: grid; place-items: center; width: 28px; height: 28px; flex: none; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); }
.cb.it .tb svg.i { width: 18px; height: 18px; }
.cb.it:hover { background: var(--hl); }
.cb.it:hover .tb { border-color: var(--accent); color: var(--text); }
.cb.it.on .tb { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.cb.it.on:hover .tb { background: color-mix(in srgb, var(--accent) 26%, var(--panel)); }
.pnote { color: var(--faint); font-size: 12px; padding: 2px 0; }

/* Messages at the foot. A draft that fails: neutral words under a title
   washed red, and Add anyway (OK waits meanwhile). */
.pmsg { font-size: 12.5px; line-height: 1.4; }
.pmsg.err { color: var(--danger); }
.pmsg.warn { color: var(--c-cons); }
.pmsg.need { color: var(--muted); }
.pmsg.fail { border-radius: 6px; background: var(--panel); color: var(--muted); overflow: hidden; }
.pmsg.fail .ft { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--danger-wash); }
.pmsg.fail .ft svg.i { flex: none; width: 14px; height: 14px; color: var(--danger); }
.pmsg.fail .ft b { font-weight: 600; color: var(--text); }
.pmsg.fail .fx { padding: 5px 8px 7px; }
.pmsg.fail .fa { display: flex; justify-content: flex-end; padding: 0 8px 8px; }
.pbtn { height: 24px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--danger-text); cursor: pointer; font-size: 12.5px; font-weight: 600; }
.pbtn:hover { background: var(--hl); }

/* where a failed feature went wrong, drawn over the model */
.errband { fill: var(--danger); fill-opacity: .18; stroke: var(--danger); stroke-width: 1.2; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
.errband.clash { fill-opacity: .5; stroke-dasharray: none; stroke-width: 1.8; }
.erredge { stroke: var(--danger); stroke-width: 2.6; stroke-linecap: round; vector-effect: non-scaling-stroke; }

</style>
</head>
<body>
<div id="win">
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <div class="tip" id="tip" hidden></div>
</div>
<script src="mock.js"></script>
<script>
// ---------------------------------------------------------------- solid operations
// Revolve, combine, move, mirror, the patterns, fillet, chamfer and shell. Each
// is set up in a floating panel at the viewport's right, like the app's
// extrude: pick fields filled by clicks in the view (the outlined one takes
// them), values checked as they're typed, OK once it all reads. Committed,
// it's a timeline row keeping its parameters, to edit it again; the model
// stays as it is.
const len = a => Math.hypot(...a);
// Normal of a planar loop from its winding: the loop turns anticlockwise about it.
const newell = ps => norm(ps.reduce((n, p, i) => {
  const q = ps[(i + 1) % ps.length];
  return [n[0] + (p[1] - q[1]) * (p[2] + q[2]), n[1] + (p[2] - q[2]) * (p[0] + q[0]), n[2] + (p[0] - q[0]) * (p[1] + q[1])];
}, [0, 0, 0]));
const fmt = v => String(+v.toFixed(2));
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const labelOf = (list, v) => list.find(([k]) => k === v)?.[1];
const boxesMeet = (a, b) => a.every(([lo, hi], i) => lo <= b[i][1] + 1e-6 && b[i][0] <= hi + 1e-6);

// Reads a typed value, a number with or without its unit, in mm or degrees.
// Anything out of bounds is refused with a note in errs, so nothing typed
// reaches the geometry unchecked.
const UNITS = { mm: { '': 1, mm: 1, cm: 10, m: 1000, in: 25.4 }, deg: { '': 1, '°': 1, deg: 1 }, count: { '': 1, x: 1, '×': 1 } };
function readVal(o, name, errs, { unit = 'mm', min = 0, max = 10000, signed = false, int = false } = {}) {
  const s = String(o[name] ?? '').trim(), m = /^([-+]?(?:\d+\.?\d*|\.\d+))\s*([a-z°×]*)$/i.exec(s);
  const u = unit === 'mm' ? ' mm' : unit === 'deg' ? '°' : '';
  let bad = !s ? 'Enter a value' : !m ? 'Not a number' : !(m[2].toLowerCase() in UNITS[unit]) ? `Unknown unit “${m[2]}”` : null;
  const v = bad ? 0 : +m[1] * UNITS[unit][m[2].toLowerCase()];
  if (!bad) {
    if (int && !Number.isInteger(v)) bad = 'A whole number';
    else if (signed ? Math.abs(v) > max : v > max) bad = signed ? `Within ±${max}${u}` : `At most ${max}${u}`;
    else if (!signed && (int ? v < min : v <= min)) bad = int ? `At least ${min}` : `More than ${min}${u}`;
  }
  if (bad) { errs[name] = bad; return null; }
  return v;
}

// Rigid transforms of points (p) and normals (n).
const XF = {
  id: { p: p => p, n: n => n },
  move: v => ({ p: p => add(p, v), n: n => n }),
  // Rodrigues' rotation about the line through a along unit d.
  turn: (a, d, deg) => {
    const c = Math.cos(rad(deg)), s = Math.sin(rad(deg));
    const r = v => add(add(mul(v, c), mul(cross(d, v), s)), mul(d, dot(d, v) * (1 - c)));
    return { p: p => add(a, r(sub(p, a))), n: r };
  },
  mirror: (a, n) => ({ p: p => sub(p, mul(n, 2 * dot(sub(p, a), n))), n: v => sub(v, mul(n, 2 * dot(v, n))) }),
  then: (x, y) => ({ p: p => y.p(x.p(p)), n: v => y.n(x.n(v)) }),
};
// Copies drop the face ids, so only the original's faces can be picked by id.
function xformFaces(faces, x, keepIds = false) {
  const P = ps => ps.map(x.p), id = v => keepIds ? v : undefined;
  return faces.map(f => ({
    ...f, id: id(f.id), n: x.n(f.n), p: P(f.p),
    holes: (f.holes || []).map(h => ({ ...h, id: id(h.id), near: P(h.near), far: P(h.far) })),
    tangents: (f.tangents || []).map(t => t.map(x.p)),
    opening: f.opening && P(f.opening),
  }));
}

const ctxOf = (bodies, active) => ({ bodies, regions: regionsAt(active), edges: bracketEdges(bodies), br: bodies.find(b => b.id === 'body') });
const opCtx = () => { const active = activeFeatures(); return ctxOf(bodiesAt(active), active); };
const ready = r => !r.error && !r.need && !Object.keys(r.errs).length;

const ORIGIN_AXES = { 'axis-x': [1, 0, 0], 'axis-y': [0, 1, 0], 'axis-z': [0, 0, 1] };
const AXIS_COLOR = { 'axis-x': AXIS_COLORS[0], 'axis-y': AXIS_COLORS[1], 'axis-z': AXIS_COLORS[2] };
const ORIGIN_PLANES = { 'plane-xy': [0, 0, 1], 'plane-xz': [0, 1, 0], 'plane-yz': [1, 0, 0] };
const FACE_NAME = {
  'side': 'Front face', 'side-b': 'Rear face', 'bottom': 'Underside', 'back': 'Back face',
  'base-x': 'Base end', 'base-top': 'Base top', 'up-x': 'Upright face', 'up-top': 'Upright top',
};
const RIM_SIDE = { 'bottom': 'under', 'base-top': 'top', 'back': 'back', 'up-x': 'front' };

// A sketch's closed regions and its lines, in model space.
const sketchName = sk => st.doc.timeline.find(t => t.id === sk)?.name || sk;
function sketchRegions(sk) {
  const s = SKETCHES[sk], f = PLANES[s.plane].f, o = f(0, 0), n = norm(cross(sub(f(1, 0), o), sub(f(0, 1), o)));
  const loops = [...(s.closed ? [s.closed.map(p => f(...p))] : []), ...(s.circles || []).map(c => circ(f, c.c[0], c.c[1], c.r))];
  return loops.map((pts, i) => ({ id: `${sk}:${i}`, sketch: sk, o, n, pts, label: `${sketchName(sk)} · region ${i + 1}` }));
}
function sketchLines(sk) {
  const s = SKETCHES[sk];
  if (!s?.closed) return [];
  const f = PLANES[s.plane].f, c = s.closed;
  return c.map((p, i) => ({ id: `${sk}:l${i}`, sketch: sk, a: f(...p), b: f(...c[(i + 1) % c.length]), label: `Line ${i + 1} · ${sketchName(sk)}` }));
}
const regionsAt = active => st.doc.kind === 'bracket' ? Object.keys(SKETCHES).filter(sk => active.has(sk)).flatMap(sketchRegions) : [];

// The bracket's edges, keyed by the two faces meeting there (or rim:hole:face
// for a hole's rim), each side with the unit vector running into its face.
function edgesOf(faces) {
  const m = new Map(), key = p => p.map(x => x.toFixed(3)).join();
  for (const f of faces) {
    if (!f.id) continue;
    const N = newell(f.p);
    f.p.forEach((a, i) => {
      const b = f.p[(i + 1) % f.p.length], k = [key(a), key(b)].sort().join('/');
      if (!m.has(k)) m.set(k, { a, b, sides: [] });
      m.get(k).sides.push({ f, w: norm(cross(N, sub(b, a))) });
    });
  }
  const out = new Map();
  for (const e of m.values()) {
    if (e.sides.length !== 2) continue;
    const id = e.sides.map(s => s.f.id).sort().join('|');
    out.set(id, { ...e, id, label: 'Edge ' + (EDGE_NUM[id] || '?'), meta: fmt(len(sub(e.b, e.a))) + ' mm' });
  }
  for (const f of faces) for (const h of f.holes || []) {
    if (!f.id || !h.id) continue;
    const id = `rim:${h.id}:${f.id}`, c = mul(h.near.reduce(add), 1 / h.near.length), r = len(sub(h.near[0], c));
    out.set(id, { id, rim: h.near, c, r, sides: [{ f }], label: `${FACE_INFO[h.id][2]} rim, ${RIM_SIDE[f.id]}`, meta: 'Ø' + fmt(2 * r) });
  }
  return out;
}
const EDGE_NUM = {};
[...edgesOf(BRACKET).keys()].filter(k => !k.startsWith('rim:')).forEach((k, i) => { EDGE_NUM[k] = i + 1; });
const bracketEdges = bodies => { const b = bodies.find(b => b.id === 'body'); return b ? edgesOf(b.faces) : new Map(); };
// How far a face reaches from an edge into it: what a fillet or chamfer there has room for.
const widthIn = (side, a) => Math.max(...side.f.p.map(v => dot(sub(v, a), side.w)));
const edgeCap = e => e.rim ? Math.min(e.r, 10) : Math.min(...e.sides.map(s => widthIn(s, e.a)));

// Axes: an origin axis, a sketch line or a straight edge of the bracket.
function axisOf(id, bodies) {
  if (!id) return null;
  if (ORIGIN_AXES[id]) return { p: [0, 0, 0], d: ORIGIN_AXES[id], label: id[5].toUpperCase() + ' axis' };
  if (/:l\d+$/.test(id)) {
    const l = sketchLines(id.split(':')[0]).find(l => l.id === id);
    return l ? { p: l.a, d: norm(sub(l.b, l.a)), label: l.label } : null;
  }
  const e = bracketEdges(bodies).get(id);
  return e && !e.rim ? { p: e.a, d: norm(sub(e.b, e.a)), label: e.label } : null;
}
// Planes: an origin plane or a planar face of the bracket.
function planeOf(id, bodies) {
  if (!id) return null;
  if (ORIGIN_PLANES[id]) return { p: [0, 0, 0], n: ORIGIN_PLANES[id], label: FACE_INFO[id][1] + ' plane', short: FACE_INFO[id][1] };
  const f = bodies.find(b => b.id === 'body')?.faces.find(f => f.id === id);
  return f ? { p: f.p[0], n: f.n, label: FACE_NAME[id], short: FACE_NAME[id] } : null;
}

// A closed loop swept about axis A from span[0] to span[1] degrees, faceted.
// The loop lies in a plane holding the axis, all on one side of it.
function revolveFaces(loop, A, span) {
  const D = A.d, n = newell(loop);
  let U = norm(cross(n, D));

for (const [n, [cat, svg]] of Object.entries(SELECTION_ICONS)) { I[n] = svg; CAT[n] = cat; }
const EXT_EXTENTS = [['one', 'One side', 'ex-one'], ['sym', 'Symmetric', 'ex-sym'], ['two', 'Two sides', 'ex-two'], ['thru', 'Through all', 'ex-thru']];
const REV_EXTENTS = [['full', 'Full 360°', 'rv-full'], ['one', 'One side', 'rv-one'], ['sym', 'Symmetric', 'rv-sym'], ['two', 'Two sides', 'rv-two']];
const COMBINES = [['union', 'Union', 'bo-join'], ['sub', 'Subtract', 'bo-cut'], ['int', 'Intersect', 'bo-int']];
const CIRC_MODES = [['full', 'Full 360°', 'cp-full'], ['spacing', 'Spacing', 'cp-spacing'], ['total', 'Total', 'cp-total']];
const LIN_MODES = [['spacing', 'Spacing', 'lp-spacing'], ['total', 'Total', 'lp-total']];
const CHAMFERS = [['equal', 'Equal', 'ch-equal'], ['two', 'Two distances', 'ch-two'], ['angle', 'Distance and angle', 'ch-angle']];
const SHELL_DIRS = [['in', 'Inward', 'sh-in'], ['out', 'Outward', 'sh-out']];

// Each operation: its picks (fields the view fills), init from the selection,
// the panel body, check (field errors, a blocking error or what's still
// needed, a warning), the preview and its timeline row. `needs` refuses to
// start without a body (or the bracket, whose edges and faces are the ones the
// mock can pick).
const OPS = {
  extrude: {
    label: 'Extrude', icon: 'extrude',
    picks: { regions: Pick('region', 'regions', 'Click regions to extrude', { multi: true }) },
    init: m => {
      const sk = st.sel?.kind === 'feature' && SKETCHES[st.sel.id] ? st.sel.id : null;
      const regions = m.regions.filter(g => g.sketch === sk).map(g => g.id);
      return { regions, extent: 'one', d1: '10 mm', d2: '10 mm', flip: false, op: m.bodies.length ? 'join' : 'new', excl: [], pick: 'regions' };
    },
    body: (o, m, r) => `
      ${pickList(o, 'regions', 'Profile', o.regions.map(id => ({ id, ic: 'se-region', label: m.regions.find(g => g.id === id)?.label || 'Missing region' })), 'Click regions')}
      <h4>Extent</h4>
      ${choices(o, 'extent', EXT_EXTENTS)}
      ${o.extent === 'one' || o.extent === 'sym' ? numField(o, 'd1', 'Distance', r) : ''}
      ${o.extent === 'two' ? numField(o, 'd1', 'Side 1', r) + numField(o, 'd2', 'Side 2', r) : ''}
      ${o.extent === 'sym' ? '' : tick(o, 'flip', 'Flip')}
      <h4>Operation</h4>
      ${choices(o, 'op', BOOLS)}
      ${o.op === 'new' ? '' : bodyTicks(o, m)}`,
    check(o, m) {
      const r = { errs: {} }, e = r.errs, dist = k => readVal(o, k, e);
      r.rs = o.regions.map(id => m.regions.find(g => g.id === id));
      if (!m.regions.length) r.error = 'No closed regions to extrude: draw a sketch first';
      else if (r.rs.some(g => !g)) r.error = 'A picked region is gone';
      else if (!r.rs.length) r.need = 'Click regions to extrude';
      else if (r.rs.some(g => Math.abs(Math.abs(dot(g.n, r.rs[0].n)) - 1) > 1e-6)) r.error = 'The regions face different ways: pick regions of one plane';
      if (!r.error && !r.need && o.op !== 'new' && !m.bodies.some(b => !o.excl.includes(b.id))) {
        r.error = m.bodies.length ? 'Every body is unticked: tick one under Bodies' : `No body to ${labelOf(BOOLS, o.op).toLowerCase()}`;
      }
      // The span along the regions' normal, flipped as asked.
      const s = o.flip && o.extent !== 'sym' ? -1 : 1;
      if (o.extent === 'one') { const a = dist('d1'); if (a != null) r.span = [0, a]; }
      else if (o.extent === 'sym') { const a = dist('d1'); if (a != null) r.span = [-a / 2, a / 2]; }
      else if (o.extent === 'two') { const a = dist('d1'), b = dist('d2'); if (a != null && b != null) r.span = [-b, a]; }
      else if (r.rs[0] && !r.error) {
        // Through all: on to the far side of the bodies it's cut from or joined to.
        const g = r.rs[0], far = Math.max(0, ...facesOf(m.bodies.map(b => b.id).filter(id => !o.excl.includes(id)), m).flatMap(f => f.p).map(p => s * dot(sub(p, g.o), g.n)));
        if (far < 1e-6) r.error = 'Nothing to go through on that side: flip it';
        else r.span = [0, far];
      }
      if (r.span) r.span = s > 0 ? r.span : [-r.span[1], -r.span[0]];
      return r;
    },
    preview: (o, m, r) => ({
      faces: ready(r) ? r.rs.flatMap(g => extrudeFaces(g.pts, g.n, ...r.span, g.pts.length > 12)).map(f => ({ ...f, draft: true, tint: BOOL_TINT[o.op] })) : [],
      svg: regionsSvg(o, m),
    }),
    row: (o, r) => {
      const tot = fmt(r.span[1] - r.span[0]) + ' mm';
      return { meta: o.extent === 'thru' ? 'Thru' : tot, info: `${labelOf(EXT_EXTENTS, o.extent)}${o.extent === 'thru' ? '' : ' · ' + tot} · ${labelOf(BOOLS, o.op)}` };
    },
  },

  revolve: {
    label: 'Revolve', icon: 'revolve',
    picks: {
      regions: Pick('region', 'regions', 'Click regions to revolve', { multi: true }),
      axis: Pick('axis', 'an axis', 'Click a sketch line or an origin axis to revolve about'),
    },
    init: m => {
      const sk = st.sel?.kind === 'feature' && SKETCHES[st.sel.id] ? st.sel.id : null;

      <h4>Operation</h4>
      ${choices(o, 'op', BOOLS)}
      ${o.op === 'new' ? '' : bodyTicks(o, m)}`,
    check(o, m) {
      const r = { errs: {} }, e = r.errs, ang = k => readVal(o, k, e, { unit: 'deg', max: 360 });
      r.rs = o.regions.map(id => m.regions.find(g => g.id === id));
      if (o.extent === 'full') r.span = [0, 360];
      else if (o.extent === 'one') { const a = ang('a1'); if (a != null) r.span = o.flip ? [-a, 0] : [0, a]; }
      else if (o.extent === 'sym') { const a = ang('a1'); if (a != null) r.span = [-a / 2, a / 2]; }
      else {
        const a = ang('a1'), b = ang('a2');
        if (a != null && b != null) {
          if (a + b > 360) e.a2 = 'The sides overlap: together at most 360°';
          else r.span = o.flip ? [-a, b] : [-b, a];
        }
      }
      r.axis = axisOf(o.axis, m.bodies);
      if (!m.regions.length) r.error = 'No closed regions to revolve: draw a sketch first';
      else if (r.rs.some(g => !g)) r.error = 'A picked region is gone';
      else if (!r.rs.length) r.need = 'Click regions to revolve';
      else if (!o.axis) r.need = 'Pick an axis: a sketch line or an origin axis';
      else if (!r.axis) r.error = 'The axis is gone: pick another';
      else {
        for (const g of r.rs) {
          if (Math.abs(dot(sub(r.axis.p, g.o), g.n)) > 1e-6 || Math.abs(dot(r.axis.d, g.n)) > 1e-6) {
            r.error = `The axis isn’t in ${sketchName(g.sketch)}’s plane`;
            break;
          }
          const side = g.pts.map(p => dot(sub(p, r.axis.p), cross(r.axis.d, g.n)));
          if (Math.min(...side) < -1e-6 && Math.max(...side) > 1e-6) { r.error = 'The axis crosses the region: it would revolve through itself'; break; }
        }
      }
      if (!r.error && !r.need && o.op !== 'new' && !m.bodies.some(b => !o.excl.includes(b.id))) {
        r.error = m.bodies.length ? 'Every body is unticked: tick one under Bodies' : `No body to ${labelOf(BOOLS, o.op).toLowerCase()}`;
      }
      return r;
    },
    preview: (o, m, r) => ({
      faces: ready(r) ? r.rs.flatMap(g => revolveFaces(g.pts, r.axis, r.span)).map(f => ({ ...f, draft: true, tint: BOOL_TINT[o.op] })) : [],
      svg: regionsSvg(o, m) + axisPickSvg(o, 'axis', r.axis, [...new Set((o.regions.length ? o.regions : m.regions.map(g => g.id)).map(id => id.split(':')[0]))].flatMap(sketchLines), m),

  },

  chamfer: {
    label: 'Chamfer', icon: 'chamfer', needs: 'bracket',
    picks: { edges: Pick('edge', 'edges', 'Click edges to chamfer', { multi: true }) },
    init: m => ({ edges: holeRims(m), type: 'equal', d1: '1 mm', d2: '2 mm', angle: '45°', flip: false, pick: 'edges' }),
    body: (o, m, r) => `
      ${pickList(o, 'edges', 'Edges', edgeItems(o.edges, m), 'Click edges')}
      <h4>Type</h4>
      ${choices(o, 'type', CHAMFERS)}
      ${numField(o, 'd1', o.type === 'two' ? 'Distance 1' : 'Distance', r)}
      ${o.type === 'two' ? numField(o, 'd2', 'Distance 2', r) : ''}
      ${o.type === 'angle' ? numField(o, 'angle', 'Angle', r) : ''}
      ${o.type === 'equal' ? '' : tick(o, 'flip', 'Flip sides')}`,
    check(o, m) {
      const r = edgeCheck(o, m, 'chamfer'), e = r.errs;
      const d1 = readVal(o, 'd1', e, { max: 1000 });
      let d2 = d1;
      if (o.type === 'two') d2 = readVal(o, 'd2', e, { max: 1000 });
      if (o.type === 'angle') {
        r.a = readVal(o, 'angle', e, { unit: 'deg', max: 90 });
        if (r.a === 90) { e.angle = 'Under 90°'; r.a = null; }
        d2 = r.a != null && d1 != null ? d1 * Math.tan(rad(r.a)) : null;
      }
      if (d1 != null && d2 != null) {
        r.d = o.type !== 'equal' && o.flip ? [d2, d1] : [d1, d2];
        const bad = r.es?.find(ed => ed.rim ? r.d[0] >= edgeCap(ed) : ed.sides.some((s, i) => r.d[i] >= widthIn(s, ed.a)));
        if (bad) e[o.type === 'angle' && d2 > d1 ? 'angle' : 'd1'] = `Too big for ${bad.label}: it has under ${fmt(edgeCap(bad))} mm of room`;
      }
      return r;
    },
    preview: edgePreview,
    row: (o, r) => ({
      meta: o.type === 'equal' ? fmt(r.d[0]) + ' mm' : o.type === 'two' ? `${fmt(r.d[0])} × ${fmt(r.d[1])}` : `${fmt(parseFloat(o.d1))} mm ${fmt(r.a)}°`,
      info: `${plural(o.edges.length, 'edge')} · ${labelOf(CHAMFERS, o.type)} · ${o.type === 'angle' ? `${fmt(parseFloat(o.d1))} mm at ${fmt(r.a)}°` : r.d.map(fmt).join(' × ') + ' mm'}`,
    }),
  },

  shell: {
    label: 'Shell', icon: 'shell', needs: 'bracket',
    picks: { faces: Pick('face', 'faces to remove', 'Click faces to remove, or none for a closed hollow body', { multi: true }) },
    init: () => ({ faces: st.sel?.kind === 'face' ? [st.sel.id] : [], thick: '2 mm', dir: 'in', pick: 'faces' }),
    body: (o, m, r) => `
      ${pickList(o, 'faces', 'Remove', o.faces.map(id => ({ id, ic: 'se-face', label: FACE_NAME[id] || 'Missing face', meta: FACE_INFO[id]?.[1] })), 'Click faces')}
      ${numField(o, 'thick', 'Thickness', r)}
      <h4>Direction</h4>
      ${choices(o, 'dir', SHELL_DIRS)}`,
    check(o, m) {
      const r = { errs: {} };
      r.t = readVal(o, 'thick', r.errs, { max: 100 });
      if (r.t != null && o.dir === 'in' && r.t >= 5) r.errs.thick = 'Too thick: the 10 mm walls need under 5 mm inward';
      r.fs = o.faces.map(id => m.br?.faces.find(f => f.id === id));
      if (!m.br) r.error = 'No body to shell';
      else if (r.fs.some(f => !f)) r.error = 'A picked face is gone';
      else if (!o.faces.length) r.warn = 'No faces removed: the body becomes closed and hollow';
      return r;
    },
    preview: (o, m, r) => ({
      marks: new Set(o.faces),
      svg: ready(r) ? r.fs.map(f => `<polygon class="band" points="${pts(inset(f.p, o.dir === 'in' ? r.t : -r.t))}"/>`).join('') : '',
    }),
    row: (o, r) => ({ meta: fmt(r.t) + ' mm', info: `${o.faces.length ? plural(o.faces.length, 'face') + ' removed' : 'Closed'} · ${fmt(r.t)} mm ${o.dir === 'in' ? 'inward' : 'outward'}` }),
  },
};

function opPreview(m) {
  const o = st.op, def = OPS[o.kind];
  return def.preview(o, m, def.check(o, m));
}

// The failure under the fields, and the way to add it anyway.
const failMsg = (def, fl) => `<div class="pmsg fail"><div class="ft">${icon('alert')}<b>${def.label} fails</b></div><div class="fx">${fl.message}</div>
  <div class="fa"><button class="pbtn" data-act="op:op-add">Add anyway</button></div></div>`;

function opPanel() {
  const o = st.op, def = OPS[o.kind], m = opCtx(), r = def.check(o, m), ok = ready(r);
  const failing = !r.error && !r.need && !!r.failed;
  const msgs = (r.error ? `<div class="pmsg err">${r.error}</div>` : r.need ? `<div class="pmsg need">${r.need}</div>`
    : failing ? failMsg(def, r.failed) : '')
    + (r.warn ? `<div class="pmsg warn">${r.warn}</div>` : '');
  // A failing draft is added from its message, so OK waits.
  const okBtn = `<button class="hb primary"${ok && !failing ? ' data-act="op:op-ok"' : ' disabled'} title="${failing ? 'It fails: Add anyway is in the message' : 'OK (Enter)'}">${icon('check')}</button>`;
  return `<div class="opp">
    <div class="opp-head"><span class="hic">${icon(def.icon)}</span><b>${o.editing ? o.name : 'New ' + def.label.toLowerCase()}</b>
      <button class="hb" data-act="op:op-cancel" title="Cancel (Esc)">${icon('close')}</button>
      ${okBtn}
    </div>
    <div class="opp-well">
      <div class="opp-body">${def.body(o, m, r)}</div>
      ${msgs ? `<div class="opp-foot">${msgs}</div>` : ''}
    </div>
  </div>`;
}

// Whether the next render puts the caret in the panel's first field.
let focusPanel = false;

// Starts setting up an operation, or editing one.
function openOp(kind, editId) {
  const def = OPS[kind], t = editId && st.doc.timeline.find(t => t.id === editId);
  st.op = { kind, editing: t?.id };
  const m = opCtx();
  if ((def.needs === 'body' && !m.bodies.length) || (def.needs === 'bracket' && !m.br)) {
    st.op = null;
    toast(`${def.label} needs a body: extrude a sketch first`);
    return;
  }
  Object.assign(st.op, t ? { ...structuredClone(t.params), name: t.name, pick: Object.keys(def.picks)[0] } : def.init(m));
  Object.assign(st, { pick: false, sel: null });
  focusPanel = true;
}

// What a click in the view means for the panel's field of `type`, or null.
function pickValue(type, el) {
  const [kind, ...rest] = (el.dataset.pick || '').split(':'), v = rest.join(':'), face = el.dataset.face;
  switch (type) {
    case 'region': return kind === 'region' ? v : null;
    case 'axis': return kind === 'axis' || kind === 'line' || (kind === 'edge' && !v.startsWith('rim:')) ? v : null;
    case 'edge': return kind === 'edge' ? v : null;
    case 'body': return el.dataset.body || null;
    case 'plane': return face && (ORIGIN_PLANES[face] || FACE_NAME[face]) ? face : null;
    case 'face': return face && FACE_NAME[face] ? face : null;
  }
  return null;
}

// A click goes to the field picking; failing that, to another field that
// takes what was clicked (bodies only when their field is picking, so a
// stray click on the model never drops a body).
function opPick(el) {
  const o = st.op, def = OPS[o.kind];
  const names = [o.pick, ...Object.keys(def.picks).filter(k => k !== o.pick && def.picks[k].type !== 'body')].filter(Boolean);
  for (const name of names) {
    const p = def.picks[name], v = pickValue(p.type, el);
    if (v == null) continue;
    const refused = p.accept?.(o, v);
    if (typeof refused === 'string') { toast(refused); return; }
    if (p.multi) o[name] = o[name].includes(v) ? o[name].filter(x => x !== v) : [...o[name], v];
    else o[name] = v;
    // A single field, once filled, hands the clicks to the next empty one.
    o.pick = p.multi ? name : Object.keys(def.picks).find(k => def.picks[k].multi ? !o[k].length : o[k] == null) || null;
    return;
  }
  toast(def.picks[o.pick]?.hint || 'Click a field in the panel to pick into it');
}

function commitOp() {
  const o = st.op, def = OPS[o.kind], m = opCtx(), r = def.check(o, m);
  if (!ready(r)) { toast(r.error || Object.values(r.errs)[0] || r.need); return; }
  const { kind, editing, name, pick, ...params } = o;
  const d = st.doc, row = { type: kind, params: structuredClone(params), ...def.row(params, r, m), failed: r.failed?.message };
  let id = editing;
  if (editing) Object.assign(d.timeline.find(t => t.id === editing), row);
  else {
    id = kind + Date.now();
    d.timeline.push({ id, name: `${def.label} ${d.timeline.filter(t => t.type === kind).length + 1}`, ...row });
  }
  d.dirty = true;
  st.sel = { kind: 'feature', id };
  st.op = null;
}

// Sketching is on its own page: a new sketch on a plane or a face.
const sketchOn = plane => go('sketch.html', 'new/' + plane);

Object.assign(page, {
  doOp(id) {
    // OK waits while the draft fails; Add anyway, in its message, adds it.
    if (id === 'op-ok') {
      if (OPS[st.op.kind].check(st.op, opCtx()).failed) { toast('It fails: Add anyway is in the message'); return; }
      commitOp();
      return;
    }
    if (id === 'op-add') { commitOp(); return; }
    if (id === 'op-cancel') { st.op = null; return; }
    if (OPS[id]) { openOp(id); return; }
    st.op = null;
    const d = st.doc;
    switch (id) {
      case 'sketch':
        if (st.sel?.kind === 'face' || st.sel?.kind === 'plane') sketchOn(st.sel.id);
        else { st.pick = !st.pick; st.sel = null; }
        return;
      case 'edit-sketch': go('sketch.html', st.sel.id); return;
      case 'hide': d.hidden.add(st.sel.id); st.sel = null; return;
      case 'edit-feature': {
        const t = d.timeline.find(t => t.id === st.sel.id);
        if (t?.params && OPS[t.type]) { openOp(t.type, t.id); return; }
        break;
      }
    }
    notWired(id);
  },
  // The panel's choices (opc), ticks (opt), fields to pick into (opf) and
  // the crosses on what's been picked (opx).
  act(k, v) {
    const o = st.op;
    switch (k) {
      case 'opf': o.pick = v; return true;
      case 'opc': { const [n, val] = v.split(':'); o[n] = val; return true; }
      case 'opx': case 'opt': {
        // name, or name:id for one item of a list (edge ids have colons too).
        const i = v.indexOf(':'), n = i < 0 ? v : v.slice(0, i), id = v.slice(i + 1);
        if (i < 0) o[n] = !o[n];
        else if (Array.isArray(o[n])) o[n] = o[n].includes(id) ? o[n].filter(x => x !== id) : k === 'opt' ? [...o[n], id] : o[n];
        else o[n] = null;
        if (k === 'opx') o.pick = n;
        return true;
      }
    }
    return false;
  },
  faceClick(id) {
    const kind = id.startsWith('hole') ? 'hole' : id.startsWith('plane') ? 'plane' : 'face';
    if (!st.pick) { st.sel = st.sel?.id === id ? null : { kind, id }; return; }
    if (kind === 'hole') toast('Pick a planar face');
    else sketchOn(id);
  },
  // The selected feature's failure, from its parameters on the model as it stands.
  failure(bodies, active) {
    const t = st.doc.timeline.find(t => t.id === st.sel.id), def = OPS[t.type];
    const r = t.params && def ? def.check({ kind: t.type, ...t.params }, ctxOf(bodies, active)) : null;
    return r?.failed ? { svg: failureSvg(r.failed), marks: new Set([r.failed.face]) } : null;
  },
  // Double-clicking the model selects the whole body; a feature in the
  // timeline or the objects list opens it to edit.
  dblclick(el) {
    if (st.op) return false;
    const f = el.closest('.face, .hole');
    if (f) { st.sel = { kind: 'body', id: f.dataset.body || 'body' }; return true; }
    const r = el.closest('[data-act^="tl:"], [data-act^="obj:"]');
    const t = r && st.doc.timeline.find(t => t.id === r.dataset.act.split(':')[1]);
    if (!t) return false;
    st.sel = { kind: 'feature', id: t.id };
    if (t.type === 'sketch') go('sketch.html', t.id);
    else if (t.params && OPS[t.type]) openOp(t.type, t.id);
    else toast('Edit ' + t.name + ' — not wired up in the mock');
    return true;
  },
  afterRender() {
    if (!focusPanel) return;
    focusPanel = false;
    $('.opp input')?.select();
  },
  op: {
    label: () => OPS[st.op.kind].label,
    head() {
      const o = st.op, def = OPS[o.kind], r = def.check(o, opCtx());
      return { icon: def.icon, name: o.editing ? o.name : 'New ' + def.label.toLowerCase(), ok: ready(r) && !r.failed,
        why: r.failed ? 'It fails: Add anyway is in the message' : r.error || r.need || Object.values(r.errs)[0] };
    },
    info() {
      const o = st.op, def = OPS[o.kind], r = def.check(o, opCtx()), p = def.picks[o.pick];
      const bad = r.error || Object.values(r.errs)[0];
      const fail = !bad && !r.need && r.failed?.message;
      const msg = bad || r.need || fail || (ready(r) ? 'Ready: Enter or OK adds it' : '') + (p ? ` · ${p.hint}` : '');
      return `${icon(def.icon)}<b>${o.editing ? o.name : def.label}</b>${fail ? `<span class="alert">${icon('alert')}</span>` : ''}<span class="${bad ? 'bad' : 'muted'}">${msg}</span>`;
    },
    pickHint() {
      const p = OPS[st.op.kind].picks[st.op.pick];
      return p ? 'Pick ' + p.what : 'Pick';
    },
    preview: (bodies, active) => opPreview(ctxOf(bodies, active)),
    panel: opPanel,
    pick: opPick,
    // Bodies and origin planes in the objects list can be picked into the panel too.
    pickObject(v) {
      const isBody = bodiesAt(activeFeatures()).some(b => b.id === v);
      if (isBody || v.startsWith('plane-')) opPick({ dataset: isBody ? { body: v } : { face: v } });
    },
  },
});

// Typing in a panel field.
document.addEventListener('input', e => {
  const f = e.target.dataset?.field;
  if (!f || !st.op) return;
  st.op[f] = e.target.value;
  render();
});

// The design from the hash (listed at the top of the page), and an
// operation set up for a screenshot.
const E = (a, b) => [a, b].sort().join('|');
const SHOTS = {
  extrude: { regions: ['s2:0'], d1: '20 mm', pick: null },
  revolve: { regions: ['s1:0'], axis: 's1:l5', extent: 'one', a1: '270°', flip: true, pick: null, ...(flag('join') && { op: 'join' }) },
  combine: { tools: ['dm:0:0'] },
  move: { dx: '-20 mm', dy: '-80 mm', angle: '30°' },
  bmirror: { plane: 'plane-yz', pick: null },
  fillet: { edges: [E('base-x', 'base-top'), E('base-top', 'side'), E('up-top', 'up-x'), 'rim:hole-a:base-top', E('back', 'up-top'), E('side', 'up-top')], radius: '3 mm' },
  chamfer: { edges: [E('base-x', 'base-top'), E('base-x', 'side')], type: 'angle', d1: '3 mm', angle: '30°' },
  shell: { faces: ['up-top', 'base-x'] },
};
{
  const doc = HASH[0] || 'bracket', view = HASH[1];
  st.doc = doc === 'empty' ? makeDoc('empty', 'Untitled') : makeDoc('bracket', doc);
  if (doc !== 'empty') {
    // Revolve 1's post, from its parameters.
    const t = st.doc.timeline.find(t => t.id === 'r1'), all = new Set(st.doc.timeline.map(t => t.id));
    const r = OPS.revolve.check({ kind: 'revolve', ...t.params }, ctxOf(bodiesAt(all), all));
    st.doc.extra.push({ id: 'r1:0', feat: 'r1', name: 'Post', faces: r.rs.flatMap(g => revolveFaces(g.pts, r.axis, r.span)) });
  }
  if (view === 'face') st.sel = { kind: 'face', id: 'base-top' };
  if (view === 'body') st.sel = { kind: 'body', id: 'body' };
  if (view === 'failed') st.sel = { kind: 'feature', id: 'f2' };
  if (view === 'failed-edit') openOp('fillet', 'f2');
  for (const v of Object.keys(VIEWS)) if (flag('v-' + v)) Object.assign(cam, VIEWS[v]);
  const kind = doc !== 'empty' && view?.startsWith('op:') && view.slice(3);
  if (OPS[kind]) {
    if (kind === 'combine') {
      // A mirrored copy to combine with.
      const d = st.doc, params = { bodies: ['body'], plane: 'base-x', copy: true };
      d.timeline.push({ id: 'dm', type: 'bmirror', name: 'Mirror 1', meta: 'Base end', info: 'Bracket across Base end · copy', params });
      d.extra.push({ id: 'dm:0:0', name: 'Body 2', faces: xformFaces(bracketAt(activeFeatures()), XF.mirror([80, 0, 0], [1, 0, 0])) });
      Object.assign(cam, { zoom: 1.1, px: 40 });
    }
    if (kind === 'lpattern' || kind === 'cpattern') Object.assign(cam, { zoom: 1.6, px: kind === 'lpattern' ? 60 : 0 });
    openOp(kind);
    Object.assign(st.op, SHOTS[kind] || {});
    focusPanel = false;
  }
}
start('model');
</script>
</body>
</html>
