<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varde Icon Sets</title>
<!--
  Two icon styles side by side, every tool in a compact window, for comparing
  sets. Each pane picks its style and its own theme; colours, accent
  strength, icon size and labels apply to both. The outline set is the app's
  current icons; the other sets were drawn separately, and the variants
  repaint the flat or the accent set's drawings with CSS.
  Deep link: #a=<style>&b=<style>&p=<palette>&ac=<accent>&s=<size>&l=<0|1>&ta=<auto|light|dark>&tb=...
-->
<style>
:root, [data-theme="light"] {
  --accent: #0a95ad; --text: #2b3036; --muted: #6c747d; --faint: #9aa2ab;
  --panel: #fafafb; --title-bg: #e9ebef; --line: rgba(20, 30, 40, .11); --chip: rgba(20, 30, 40, .07);
  --hl: #e3f5da; --desk: #d3d8e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #39b9cf; --text: #e4e7ea; --muted: #9aa3ac; --faint: #69727c;
    --panel: #212228; --title-bg: #17181d; --line: rgba(255, 255, 255, .08); --chip: rgba(255, 255, 255, .08);
    --hl: rgba(118, 204, 96, .15); --desk: #101216;
  }
}
[data-theme="dark"] {
  --accent: #39b9cf; --text: #e4e7ea; --muted: #9aa3ac; --faint: #69727c;
  --panel: #212228; --title-bg: #17181d; --line: rgba(255, 255, 255, .08); --chip: rgba(255, 255, 255, .08);
  --hl: rgba(118, 204, 96, .15); --desk: #101216;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--desk); color: var(--text); font: 12.5px/1.35 system-ui, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
svg.i { width: calc(16px * var(--isz, 1)); height: calc(16px * var(--isz, 1)); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.c-sketch { --cc: var(--c-sketch); } .c-cstr { --cc: var(--c-cstr); } .c-dim { --cc: var(--c-dim); } .c-mod { --cc: var(--c-mod); }
.c-solid { --cc: var(--c-solid); } .c-surf { --cc: var(--c-surf); } .c-cons { --cc: var(--c-cons); } .c-insp { --cc: var(--c-insp); }
svg.i[class*=" c-"] { color: var(--cc); }
select { font: inherit; color: inherit; }

/* ---- controls ---- */
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0 8px 0 0; font-size: 15px; }
.ctl { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.ctl select { height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); padding: 0 6px; }
.ctl input { accent-color: var(--accent); }

/* ---- panes ---- */
main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.pane { min-width: 0; }
.pane-ctl { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 8px; }
.win { background: var(--panel); color: var(--text); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 12px 40px rgba(20, 15, 40, .22); }
.tbar { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--title-bg); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
.tbar .dots { display: flex; gap: 6px; margin-left: auto; }
.tbar .dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--chip); }
.tbar b { color: var(--text); font-weight: 600; }
.toolrow { display: flex; align-items: center; gap: 2px; padding: 4px 8px; border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; }
.toolrow .lbl { color: var(--muted); font-weight: 600; margin-right: 6px; }
.toolrow .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.tb { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; border: 0; padding: 0; background: none; border-radius: 6px; cursor: default; height: calc(30px * var(--isz, 1)); min-width: calc(30px * var(--isz, 1)); color: var(--text); }
.tb:hover { background: var(--hl); }
.tb svg.i { width: calc(19px * var(--isz, 1)); height: calc(19px * var(--isz, 1)); stroke-width: 1.5; }
.tb.lbl-right { padding: 0 8px 0 5px; font-size: 12px; }
.body { padding: 6px 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.mode { min-width: 0; }
.mode > h2 { margin: 8px 0 2px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.grp { margin: 6px 0 2px; }
.grp h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.grp h3 svg.i { width: calc(14px * var(--isz, 1)); height: calc(14px * var(--isz, 1)); }
.grp h3 .n { color: var(--faint); font-weight: 500; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(50px * var(--isz, 1)), 1fr)); gap: 1px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 1px 3px; border-radius: 6px; min-width: 0; }
.cell:hover { background: var(--hl); }
.cell svg.i { width: calc(22px * var(--isz, 1)); height: calc(22px * var(--isz, 1)); stroke-width: 1.5; }
.cell .l { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nolabels .cell .l { display: none; }
.nolabels .cells { grid-template-columns: repeat(auto-fill, minmax(calc(32px * var(--isz, 1)), 1fr)); }
</style>
</head>
<body>

  <label class="ctl"><input type="checkbox" id="labels" checked>Labels</label>
</header>

(() => {
// Blueprint tiles: every icon is a small blueprint-paper tile with white technical
// line work and the created thing in warm yellow.
(() => {
  const f = n => +n.toFixed(2);
  // the tile: tinted blueprint blue, faint grid, thin category stripe at the bottom
  const TILE =
    '<rect class="bg" x=".75" y=".75" width="22.5" height="22.5" rx="4"/>' +
    '<path class="gr" d="M8 1.5V22.5M16 1.5V22.5M1.5 8H22.5M1.5 16H22.5"/>' +
    '<path class="st" d="M1.51 21.6A4 4 0 0 0 4.75 23.25H19.25A4 4 0 0 0 22.49 21.6Z"/>';
  const tile = inner => TILE + inner;

  // small primitives
  const L = (cls, d) => `<path class="${cls}" d="${d}"/>`;
  const W = d => L('w', d);          // white line work
  const Y = d => L('y', d);          // yellow highlight
  const T = d => L('t', d);          // thin white (ticks, dimension lines)
  const D = d => L('d', d);          // dashed hidden line
  const DD = d => L('dd', d);        // dash-dot centre line
  const YD = d => L('y yd', d);      // yellow dashed
  const YF = d => L('y yf', d);      // yellow with faint fill
  const dot = (x, y, r = 1.15) => `<circle class="fw" cx="${x}" cy="${y}" r="${r}"/>`;
  const ydot = (x, y, r = 1.4) => `<circle class="fy" cx="${x}" cy="${y}" r="${r}"/>`;
  const sq = (x, y, s = 1.3) => `<rect class="w sqm" x="${f(x - s)}" y="${f(y - s)}" width="${2 * s}" height="${2 * s}"/>`;
  // arrowhead with its tip at (x, y), pointing along angle a (degrees, screen coordinates)
  const ah = (x, y, a, yellow = false, len = 2.6, hw = 1.25) => {
    const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    const bx = x - c * len, by = y - s * len;
    return `<path class="${yellow ? 'fy' : 'fw'}" d="M${f(x)} ${f(y)}L${f(bx - s * hw)} ${f(by + c * hw)}L${f(bx + s * hw)} ${f(by - c * hw)}Z"/>`;
  };
  const cmark = (x, y, s = 3) => T(`M${x - s} ${y}H${x + s}M${x} ${y - s}V${y + s}`);
  const circ = (cls, x, y, r) => `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
  const ell = (cls, x, y, rx, ry, rot = 0) => `<ellipse class="${cls}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;

  // isometric projection: x right-down, y left-down, z up
  const iso = (ox, oy) => (x, y, z) => `${f(ox + (x - y) * 0.866)} ${f(oy + (x + y) * 0.5 - z)}`;
  // an iso box, centred on (cx, cy), returning visible and hidden edge paths
  const box = (w, d, h, cx = 12, cy = 12) => {
    const P = iso(cx - (w - d) * 0.433, cy + (h - (w + d) / 2) / 2);
    return {
      P,
      vis: `M${P(0, 0, h)}L${P(w, 0, h)}L${P(w, d, h)}L${P(0, d, h)}Z` +
        `M${P(w, 0, h)}L${P(w, 0, 0)}L${P(w, d, 0)}L${P(0, d, 0)}L${P(0, d, h)}M${P(w, d, h)}L${P(w, d, 0)}`,
      hid: `M${P(0, 0, 0)}L${P(w, 0, 0)}M${P(0, 0, 0)}L${P(0, d, 0)}M${P(0, 0, 0)}L${P(0, 0, h)}`,
      top: `M${P(0, 0, h)}L${P(w, 0, h)}L${P(w, d, h)}L${P(0, d, h)}Z`,
    };
  };
  const quad = (a, b, c, d) => `M${a}L${b}L${c}L${d}Z`;

  // cubic Bezier helpers for the curvature comb
  const bez = (p, t) => {
    const u = 1 - t;
    return [0, 1].map(i => u * u * u * p[0][i] + 3 * u * u * t * p[1][i] + 3 * u * t * t * p[2][i] + t * t * t * p[3][i]);
  };
  const bezD = (p, t) => {
    const u = 1 - t;
    return [0, 1].map(i => 3 * u * u * (p[1][i] - p[0][i]) + 6 * u * t * (p[2][i] - p[1][i]) + 3 * t * t * (p[3][i] - p[2][i]));
  };
  const bezDD = (p, t) => {
    const u = 1 - t;
    return [0, 1].map(i => 6 * u * (p[2][i] - 2 * p[1][i] + p[0][i]) + 6 * t * (p[3][i] - 2 * p[2][i] + p[1][i]));
  };
  const comb = () => {

      const sp = Math.hypot(d[0], d[1]);
      const k = (d[0] * dd[1] - d[1] * dd[0]) / (sp * sp * sp);
      const n = [d[1] / sp, -d[0] / sp];
      const len = Math.min(7, Math.abs(k) * 55);
      const e = [q[0] + n[0] * len * Math.sign(-k), q[1] + n[1] * len * Math.sign(-k)];
      spikes += `M${f(q[0])} ${f(q[1])}L${f(e[0])} ${f(e[1])}`;

    for (const dy of [-5.2, -1.6, 2, 5.6]) {

      s += `M${f(12 - hx)} ${f(y - 0.6)}Q12 ${f(y + 3.4)} ${f(12 + hx)} ${f(y - 0.6)}`;
    }
    return circ('w', 12, 12, 8) + L('y yz', s);
  };

  const cube = box(9, 9, 8);

  const pb = box(9, 9, 5, 12, 14);
  const fb = box(9, 9, 7);
  const sb = box(10, 10, 8);

  const icons = {
    // ---- sketch: draw

    rectc: Y('M4 6H20V18H4Z') + D('M12 12L20 6') + cmark(12, 12, 2.5) + dot(20, 6, 1.4),
    rect3: Y('M4 12L11 5L20 14L13 21Z') + dot(4, 12, 1.4) + dot(11, 5, 1.4) + dot(20, 14, 1.4),
    circle: circ('y', 12, 12, 7.5) + cmark(12, 12, 3.5) + dot(12, 12, 1),
    circle2: circ('y', 12, 12, 7.5) + D('M4.5 12H19.5') + dot(4.5, 12, 1.5) + dot(19.5, 12, 1.5),
    circle3: circ('y', 12, 12, 7.5) + dot(12, 4.5, 1.5) + dot(5.5, 15.75, 1.5) + dot(18.5, 15.75, 1.5),
    arc3: Y('M4 16A8.94 8.94 0 0 1 20 16') + dot(4, 16, 1.5) + dot(12, 7.06, 1.5) + dot(20, 16, 1.5) + T('M4 20H20'),
    arcc: Y('M18 17A11 11 0 0 0 7 6') + D('M7 17H18M7 17V6') + cmark(7, 17, 2) + dot(18, 17, 1.3) + dot(7, 6, 1.3),
    arct: W('M3 18H11') + Y('M11 18A8 8 0 0 0 19 10') + dot(3, 18, 1.2) + dot(11, 18, 1.5) + D('M11 18H17'),
    ellipse: ell('y', 12, 12, 8.5, 5) + DD('M2.5 12H21.5M12 5V19'),
    slot: Y('M8 8H16A4 4 0 0 1 16 16H8A4 4 0 0 1 8 8Z') + DD('M2.5 12H21.5') + dot(8, 12, 1) + dot(16, 12, 1),
    polygon: Y('M12 4L18.93 8L18.93 16L12 20L5.07 16L5.07 8Z') + circ('d', 12, 12, 8) + dot(12, 12, 1),
    spline: Y('M4 17C8 4 14 22 20 7') + dot(4, 17, 1.4) + dot(11.25, 12.75, 1.4) + dot(20, 7, 1.4),

  ink: ['Accent in ink', 0],
};
function accentCss(key) {
  const [, p] = ACCENTS[key] || ACCENTS.strong;
  if (p === 100) return '';
  const toward = key === 'ink' ? 'color-mix(in srgb, var(--text) 70%, var(--panel))' : 'var(--cc)';
  const m = c => `color-mix(in srgb, ${c} ${key === 'ink' ? 0 : p}%, ${toward})`;
  const flatKeys = Object.entries(ICONSETS).filter(([k, v]) => k === 'flat' || v.icons === ICONSETS.flat?.icons).map(([k]) => k);
  const line = flatKeys.filter(k => k.startsWith('colline')), fill = flatKeys.filter(k => !k.startsWith('colline'));
  const sel = (keys, inner) => keys.map(k => `svg.is-${k} ${inner}`).join(', ');
  return `
svg.is-accline .a, svg.is-acclinelite :is(.a, .af) { stroke: ${m('var(--ac)')} }
svg.is-accline :is(.af) { fill: ${m('var(--ac)')} }
svg.is-accline .ao { fill: ${m('var(--ac)')}; stroke: ${m('var(--ac)')} }
svg.is-acclinelite .ao { stroke: ${m('var(--ac)')} }
svg.is-accline .ta { fill: color-mix(in srgb, ${m('var(--ac)')} 30%, transparent) }
${sel(fill, '.xa')} { fill: ${m('var(--ca)')} }
${sel(flatKeys, '.xka')} { stroke: ${m('var(--ca)')} }
${sel(line, '.xa')} { fill: color-mix(in srgb, ${m('var(--ca)')} 40%, var(--panel)); stroke: ${m('var(--ca)')} }`;
}
const setAccent = key => { document.getElementById('icon-accent').textContent = accentCss(key); };
const accentOptions = () => Object.entries(ACCENTS).map(([k, [label]]) => `<option value="${k}">${label}</option>`).join('');

// ---------------------------------------------------------------- page
const $ = s => document.querySelector(s);
// a and b are the panes' icon styles and ta/tb their themes; p palette, ac
// accent, s icon size, l labels. All of it is kept in the link.
const st = { a: 'acclinelite', b: 'accline', p: 'distinctpurple', ac: 'soft', s: '1', l: '1', ta: 'auto', tb: 'auto' };
const STYLES = [...Object.keys(ICONSETS), ...OUTLINE_STYLES.map(([k]) => k)];
const VALID = { a: STYLES, b: STYLES, p: Object.keys(PALETTES), ac: Object.keys(ACCENTS), s: ['.85', '1', '1.2', '1.45'], l: ['0', '1'], ta: ['auto', 'light', 'dark'], tb: ['auto', 'light', 'dark'] };
const styleLabel = key => ICONSETS[key]?.label || OUTLINE_STYLES.find(([k]) => k === key)[1];
// The model toolbar with nothing selected, in groups; the first group is labelled.
const TOOLROW = [['sketch', 'extrude', 'revolve'], ['hole', 'fillet', 'chamfer', 'shell', 'combine', 'move', 'lpattern'], ['measure']];

function pane(id, key, theme) {
  const ic = x => iconSvg(key, x.id, `c-${x.cat}`);
  const tool = (x, label) => `<span class="tb${label ? ' lbl-right' : ''}" title="${tip(x)}">${ic(x)}${label ? x.label : ''}</span>`;
  const toolrow = TOOLROW.map((g, i) => g.map(t => tool(ALL[t], i === 0)).join('')).join('<span class="sep"></span>');
  const groups = (title, set) => `<div class="mode"><h2>${title}</h2>${set.map(g => `<div class="grp">
      <h3>${iconSvg(key, g.icon, `c-${g.cat}`)}${g.name}<span class="n">${flat(g).length}</span></h3>
      <div class="cells">${flat(g).map(x => `<div class="cell" title="${tip(x)}">${ic(x)}<span class="l">${x.label}</span></div>`).join('')}</div>
    </div>`).join('')}</div>`;
  return `<div class="pane-ctl">
      <div class="ctl">Style<select data-k="${id}">${iconStyleOptions()}</select></div>
      <div class="ctl">Theme<select data-t="${id}"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
    </div>
    <div class="win ic-${key}${st.l === '1' ? '' : ' nolabels'}"${theme === 'auto' ? '' : ` data-theme="${theme}"`}>
      <div class="tbar"><b>bracket.varde</b> — ${styleLabel(key)}<span class="dots"><span></span><span></span><span></span></span></div>
      <div class="toolrow"><span class="lbl">Model</span>${toolrow}</div>
      <div class="body">${groups('Sketch', SKETCH)}${groups('Model', MODEL)}</div>
    </div>`;
}

function render() {
  document.documentElement.style.setProperty('--isz', st.s);
  setPalette(st.p);
  setAccent(st.ac);
  for (const k of ['a', 'b']) {
    $('#p' + k).innerHTML = pane(k, st[k], st['t' + k]);
    $(`[data-k="${k}"]`).value = st[k];
    $(`[data-t="${k}"]`).value = st['t' + k];
  }
  $('#palette').value = st.p;
  $('#accent').value = st.ac;
  $('#isz').value = st.s;
  $('#labels').checked = st.l === '1';
  history.replaceState(null, '', '#' + new URLSearchParams(st));
}

$('#palette').innerHTML = paletteOptions();
$('#accent').innerHTML = accentOptions();
installIcons();
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (VALID[k]?.includes(v)) st[k] = v;
$('#palette').addEventListener('change', e => { st.p = e.target.value; render(); });
$('#accent').addEventListener('change', e => { st.ac = e.target.value; render(); });
$('#isz').addEventListener('change', e => { st.s = e.target.value; render(); });
$('#labels').addEventListener('change', e => { st.l = e.target.checked ? '1' : '0'; render(); });
$('main').addEventListener('change', e => {
  const { k, t } = e.target.dataset;
  if (k) st[k] = e.target.value;
  if (t) st['t' + t] = e.target.value;
  render();
});
render();
</script>
</body>
</html>
