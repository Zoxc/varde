# REUSE 3 (https://reuse.software): the license of every file, checked by
# `reuse lint` (tools/ci.sh). Files without an SPDX header take these; a
# header in the file wins ("closest"). The license texts are in LICENSES/.
# Our own files carry no copyright line, so tools/ci.sh checks only the
# license findings of the lint and ignores missing copyright; third-party
# files (the fonts below, derived code) keep their authors' copyright.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "crates/web/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2012-2015 The Mozilla Foundation and Telefonica S.A."
SPDX-License-Identifier = "OFL-1.1"
