[package]
name = "varde-expr"
description = "Typed values: expressions with units, parsed, checked and evaluated"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `Serialize` and `Deserialize` on `Value` and the units, for the crates
# that store them; the parser and evaluator need nothing.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
