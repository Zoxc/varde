[package]
name = "varde-app"
description = "The varde application: state, update loop and entry point"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varde-document.workspace = true
varde-sketch.workspace = true
varde-expr.workspace = true
varde-kernel.workspace = true
varde-regen.workspace = true
varde-solve.workspace = true
varde-io.workspace = true
varde-render.workspace = true
varde-view.workspace = true
iced.workspace = true
glam.workspace = true
log.workspace = true

[dev-dependencies]
varde-view = { workspace = true, features = ["probe"] }
# Splits by two booleans in tests, the kernel's not being built.
varde-regen = { workspace = true, features = ["testing"] }
iced_runtime.workspace = true
png.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg.workspace = true

# Asks before the page goes with unsaved changes, see `src/platform/web/page.rs`,
# and copies measures to the clipboard.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
# Waiting for the handle of a file dropped, on Chromium.
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "BeforeUnloadEvent",
    "Clipboard",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "MouseEvent",
    "Navigator",
    "VisibilityState",
    "Window",
] }
