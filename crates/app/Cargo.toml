[package]
name = "varde-app"
description = "The varde application: state, update loop and entry point"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varde-document.workspace = true
varde-kernel.workspace = true
varde-regen.workspace = true
varde-io.workspace = true
varde-render.workspace = true
varde-view.workspace = true
iced.workspace = true
glam.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg.workspace = true

# Asks before the page goes with unsaved changes, see `src/platform/web/page.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "BeforeUnloadEvent",
    "Document",
    "Event",
    "EventTarget",
    "VisibilityState",
    "Window",
] }
