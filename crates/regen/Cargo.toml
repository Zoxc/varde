[package]
name = "varde-regen"
description = "Heavy document work behind a request/response boundary, so it can run off the UI thread"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `testing`: other crates' tests split by two booleans in place of the
# kernel's split, and chamfer, shell, fillet, offset face, draft, sweep
# and loft by stand-ins in place of the kernel's, which aren't built yet.
testing = []

[dependencies]
varde-document.workspace = true
varde-lane.workspace = true
varde-kernel.workspace = true
# Solves each sketch, to tell those that don't.
varde-sketch.workspace = true
serde.workspace = true
# Sketch geometry, turned into profiles.
glam.workspace = true
# Keys of the cache, by the values' encoding (src/cache.rs), and the wire
# format (src/wire.rs).
postcard.workspace = true
# The picking hierarchies' nodes as bytes (src/pick_tables.rs), and the
# wire format (src/wire.rs).
bytemuck.workspace = true

# The Web Worker lane.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
log.workspace = true

[dev-dependencies]
# How long the fuzz runs are (`VARDE_TESTS`, `VARDE_TEST_SEED`).
varde-testing.workspace = true
# Typed distances of extrudes made in tests.
varde-expr.workspace = true
# Waiting on the thread lane in tests.
varde-lane = { workspace = true, features = ["testing"] }
futures.workspace = true
# Documents as files hold them, bits flipped, in the combine fuzz.
rmp-serde.workspace = true
