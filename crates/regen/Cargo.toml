[package]
name = "varde-regen"
description = "Heavy document work behind a request/response boundary, so it can run off the UI thread"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varde-document.workspace = true
varde-lane.workspace = true
varde-kernel.workspace = true
# Solves each sketch, to tell those that don't.
varde-sketch.workspace = true
serde.workspace = true

# The Web Worker lane.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
# The wire format, src/wire.rs.
postcard.workspace = true
bytemuck.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
log.workspace = true

[dev-dependencies]
# Waiting on the thread lane in tests.
varde-lane = { workspace = true, features = ["testing"] }
futures.workspace = true
glam.workspace = true
# src/wire.rs is tested natively.
postcard.workspace = true
bytemuck.workspace = true
