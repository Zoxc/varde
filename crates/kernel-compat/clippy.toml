# Angles, logarithms and powers from std, and glam's angle and rotation
# methods built on them, come from the platform's maths library, whose
# last bits differ between platforms (see `src/trig.rs`). The kernel takes
# them from `crate::trig` (the `libm` crate) instead, the same bits natively
# and on wasm. Tests using std as an independent reference allow
# `clippy::disallowed_methods` in their module.
