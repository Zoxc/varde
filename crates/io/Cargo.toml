[package]
name = "varde-io"
description = "File system access off the UI thread: the IO lane, which owns the open documents, their lock files and the recent files list, and the file pickers that feed it"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varde-document.workspace = true
varde-kernel.workspace = true
varde-lane.workspace = true
serde.workspace = true
# The wire format, src/wire.rs.
postcard.workspace = true
# The .vrdp payload, src/vrdp.rs.
rmp-serde.workspace = true
snap.workspace = true
xxhash-rust.workspace = true
getrandom.workspace = true
# The 3MF packages' zip, src/three_mf.rs.
miniz_oxide.workspace = true
crc32fast.workspace = true
# recent.toml and settings.toml.
toml.workspace = true
# Designs' thumbnails, src/thumbnail.rs.
png.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories.workspace = true
rfd.workspace = true

# The IO Web Worker, the Origin Private File System and the page's file
# pickers and downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The worker's wake channel and the page's responses.
futures.workspace = true
# A file's id from the browser's `crypto.getRandomValues`.
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomException",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FileReaderSync",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemWritableFileStream",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "Node",
    "Storage",
    "StorageManager",
    "Url",
    "Window",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "WritableStream",
] }

[dev-dependencies]
# Waiting on the thread lane in tests.
varde-lane = { workspace = true, features = ["testing"] }
# Polling the native lane's responses.
futures.workspace = true
# Running the code over a `Dir`, which is async for the browser's sake.
pollster.workspace = true
# Reading back the 3MF packages' XML, and the solids written.
roxmltree.workspace = true
glam.workspace = true
# Sketches with splines, the deepest a payload nests.
varde-sketch.workspace = true
# Typing a move's offsets and angle.
varde-expr.workspace = true
