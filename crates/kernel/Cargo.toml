[package]
name = "varde-kernel"
description = "Varde geometry kernel: tiled surfaces, B-reps, booleans and tessellation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Development builds: `Unsupported::Stage`, for the cases the kernel's
# current stage of development leaves out. A release build has none.
staging = []

[dependencies]
varde-decide.workspace = true
glam.workspace = true
malachite.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[dev-dependencies]
# The counting's test faces, for benches/calibrate.rs.
varde-decide = { workspace = true, features = ["testing"] }
varde-testing.workspace = true
varde-testkit.workspace = true
# For tests/ban_probe.rs only, until the kernel depends on them itself.
rayon.workspace = true
spade.workspace = true

# The unit table's calibration (benches/calibrate.rs): `cargo bench -p
# varde-kernel --bench calibrate`.
[[bench]]
name = "calibrate"
harness = false

[lints.rust]
# tools/ci.sh builds tests/ban_probe.rs with `--cfg ban_probe`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ban_probe)"] }
