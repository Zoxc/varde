# Bans for the Varde kernel crates (varde-decide, varde-kernel, varde-testkit),
# the determinism rules of the porting guide (impl/80-porting-guide.md §2,
# component C06). The same file is in crates/decide, crates/kernel and
# crates/testkit: clippy reads the one in the crate's own directory, and a
# workspace-wide file would bind every other crate too. tools/ci.sh checks
# the three copies are equal.
#
# - std's angles, logarithms and powers, and glam's methods built on them,
#   come from the platform's maths library, whose last bits differ between
#   platforms: use varde_decide::num::trig (the `libm` crate), the same
#   bits natively and on wasm;
# - `mul_add` rounds once where `a * b + c` rounds twice;
# - `f64::min`/`max` may return either zero when +0 and -0 tie; glam's
#   (and its `clamp`) pick by argument order, so `min(a, b)` and
#   `min(b, a)` differ in the sign of a zero;
# - std's hash maps iterate in a random order per process;
# - rayon's reductions combine, and its `min`/`max`/`*_any` pick among
#   ties, in an order that depends on the split; its `try_for_each*`
#   return whichever failure came first, `while_some` stops at whichever
#   `None`, and `par_bridge` yields in the order the threads take items
#   (a `collect` into `Result` or `Option` also returns whichever failure
#   came first, which no ban can catch: collect with `par_map`, then look
#   for the first failure in order);
# - spade's bulk loads insert in their own order, and its `AngleLimit`
#   from an angle and natural-neighbour gradients use std's maths.
#
# Code where a banned call can't change a result (a test using std as an
# independent reference, a min of values known to be non-zero) allows
# `clippy::disallowed_methods` / `clippy::disallowed_types` on the item or
# module, with a reason.
