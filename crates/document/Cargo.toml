[package]
name = "varde-document"
description = "Document state, editing commands and undo/redo. No UI code."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `Document::example` and revisions and generations named by number, for
# other crates' tests.
testing = []

[dependencies]
varde-kernel-compat.workspace = true
varde-sketch.workspace = true
varde-expr = { workspace = true, features = ["serde"] }
glam.workspace = true
serde.workspace = true
postcard.workspace = true
