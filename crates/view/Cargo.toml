[package]
name = "varde-view"
description = "iced widgets and layout"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varde-document.workspace = true
varde-sketch.workspace = true
varde-expr.workspace = true
varde-render.workspace = true
varde-kernel-compat.workspace = true
# The picking tables of the model shown, which the viewport picks with.
varde-regen.workspace = true
iced.workspace = true
glam.workspace = true
log.workspace = true

[features]
# `probe`: what other crates' tests find on a screen laid out headless, and
# answering preview requests in place of the GPU.
probe = []

[dev-dependencies]
# The example design, revisions and generations by number.
varde-document = { workspace = true, features = ["testing"] }
# Building sketches.
varde-sketch = { workspace = true, features = ["testing"] }
# Blocks on wgpu setup in headless render tests.
pollster.workspace = true
# An independent reference for the bits of saved angles.
libm.workspace = true
# Reading back the MCP tab's Codex line.
toml.workspace = true
