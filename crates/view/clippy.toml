# Angles, logarithms and powers from std, and glam's angle and rotation
# methods built on them, come from the platform's maths library, whose
# last bits differ between platforms. Typed angles, tangent snaps, snapped
# lengths and the side a dimension is placed on are saved into the design,
# so the view takes these from `varde_sketch::angle` (the `libm` crate)
# instead, the same bits natively and on wasm. Only `f64` and glam's `D*`
# types are listed: the view's `f32` maths (the view cube, zooming) is
# display only. Display-only `f64` code, and tests using std to build
# inputs, allow `clippy::disallowed_methods` where they use it.
disallowed-methods = [
    { path = "f64::sin", reason = "platform maths library; use varde_sketch::angle" },
    { path = "f64::cos", reason = "platform maths library; use varde_sketch::angle" },
    { path = "f64::sin_cos", reason = "platform maths library; use varde_sketch::angle" },
    { path = "f64::tan", reason = "platform maths library; use varde_sketch::angle" },
    { path = "f64::asin", reason = "platform maths library; use varde_sketch::angle" },
